name: package

on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/package.yml
      - scripts/package.sh
      - rust-toolchain.toml

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  package:
    name: canon / Linux x86_64 archives
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the compiler pinned in rust-toolchain.toml
        run: rustup toolchain install

      - name: The tag is the workspace version
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ "$TAG" != "$version" ]; then
            echo "tag $TAG is not the workspace version $version" >&2
            exit 1
          fi

      - name: Package x86_64-unknown-linux-gnu (glibc 2.17 at most)
        run: sh scripts/package.sh x86_64-unknown-linux-gnu

      - name: Package x86_64-unknown-linux-musl (static)
        run: sh scripts/package.sh x86_64-unknown-linux-musl

      - name: List the archives
        run: |
          ls -l target/package/*.tar.gz
          cat target/package/SHA256SUMS
          cd target/package && sha256sum --check --strict SHA256SUMS

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: canon-linux-x86_64
          path: |
            target/package/*.tar.gz
            target/package/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
