name: check

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: check-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: canon / task check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          class=code
          if [ "$EVENT_NAME" = pull_request ]; then
            class=$(sh scripts/classify-changes.sh --diff "origin/$BASE_REF" || echo code)
          fi
          case "$class" in
            code | docs-site-only | planning-only) ;;
            *)
              echo "the classifier answered \`$class\`, none of code, docs-site-only, planning-only" >&2
              exit 1
              ;;
          esac
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "changed files classified: $class"

      - name: Install the compiler pinned in rust-toolchain.toml
        if: steps.classify.outputs.class != 'planning-only'
        run: rustup toolchain install

      - name: Install go-task
        if: steps.classify.outputs.class != 'planning-only'
        env:
          TASK_VERSION: "3.52.0"
          TASK_SHA256: 02c679ffae53dca791804847d78b31731615894e292948397c971c87ac9e95bd
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/task.tar.gz" \
            "https://github.com/go-task/task/releases/download/v$TASK_VERSION/task_linux_amd64.tar.gz"
          echo "$TASK_SHA256  $RUNNER_TEMP/task.tar.gz" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/task-bin"
          tar -xzf "$RUNNER_TEMP/task.tar.gz" -C "$RUNNER_TEMP/task-bin" task
          echo "$RUNNER_TEMP/task-bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        if: steps.classify.outputs.class != 'planning-only'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version

      - name: Install ess
        if: steps.classify.outputs.class == 'code'
        env:
          ESS_VERSION: "0.97.4"
          ESS_SHA256: 235ad6a993c3e81369e3b5439a4ef8d6e2b82df66ad8e4a22809e00557297938
        run: |
          set -euo pipefail
          asset="ess-$ESS_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          release="https://github.com/beyond10x/ess/releases/download/$ESS_VERSION"
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output "$asset" "$release/$asset"
          curl --fail --silent --show-error --location --output SHA256SUMS "$release/SHA256SUMS"
          grep -Fx "$ESS_SHA256  $asset" SHA256SUMS
          grep -F "  $asset" SHA256SUMS | sha256sum --check --strict
          tar -xzf "$asset"
          echo "$RUNNER_TEMP/ess-$ESS_VERSION-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"

      - name: Allow unprivileged user namespaces
        if: steps.classify.outputs.class == 'code'
        run: |
          set -eu
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          unshare --net --map-current-user -- true

      - name: task check
        if: steps.classify.outputs.class == 'code'
        run: task check

      - name: task test-slow
        if: steps.classify.outputs.class == 'code'
        run: task test-slow

      - name: task docs-site-check
        if: steps.classify.outputs.class == 'docs-site-only'
        run: task docs-site-check
