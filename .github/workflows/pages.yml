name: Documentation validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-build-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          class=code
          if [ "$EVENT_NAME" = pull_request ]; then
            class=$(sh scripts/classify-changes.sh --diff "origin/$BASE_REF" || echo code)
          fi
          echo "class=$class" >> "$GITHUB_OUTPUT"
          echo "changed files classified: $class"
      - name: Install the compiler pinned in rust-toolchain.toml
        if: steps.classify.outputs.class != 'planning-only'
        run: rustup toolchain install
      - name: Install cargo-nextest
        if: steps.classify.outputs.class != 'planning-only'
        env:
          NEXTEST_VERSION: "0.9.143"
          NEXTEST_SHA256: 66786b9abe23920d022a182d1416b1bbc8130dd4872a9553d76985a1708dcd1e
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --output "$RUNNER_TEMP/nextest.tar.gz" \
            "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin" cargo-nextest
          cargo nextest --version
      - if: steps.classify.outputs.class != 'planning-only'
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Check the generated pages are current
        if: steps.classify.outputs.class != 'planning-only'
        run: |
          cargo nextest run --locked -p canon-docs
          cargo build --locked -p canon-cli
          cargo run --locked -p canon-docs -- generate --check
      - name: Build the Docusaurus site
        if: steps.classify.outputs.class != 'planning-only'
        run: npm --prefix website ci && npm --prefix website run build
      - name: Declare what was built
        if: steps.classify.outputs.class != 'planning-only'
        run: cargo run --locked -p canon-docs -- site-manifest --out website/build --commit "$GITHUB_SHA"
      - name: Upload the exact built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: b10x-project-site
          path: website/build
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: error
