items:
  - label: Typed catalog assertions
    area: Language
    story: story:assertion-expressions
    detail: canon-expr/1 parsing, type checking, recipes, exact numbers, acquisition planning and pure replay over typed observations; available in source release 0.1.0.
    href: /docs/concepts/assertions
  - label: protocol/1 source model and parser
    area: Language
    story: story:protocol-source-model
    detail: Artifacts, evidence kinds, claims, obligations, actions, outcomes and invalidation rules, read strictly; unknown keys and explicit nulls are refused.
    href: /docs/reference/protocol
  - label: Deterministic validation
    area: Language
    story: story:protocol-source-model
    detail: Format, identifiers, duplicates, unresolved references and claim cycles, in a stable order.
    href: /docs/reference/validation
  - label: canon-ir/1 compilation
    area: Language
    story: story:canon-ir
    detail: Canonical ordering, explicit defaults, one serialization suitable for hashing.
    href: /docs/reference/canon-ir
  - label: ESS specification of the data model
    area: Language
    story: story:ess-hard-gate
    detail: The model is specified under ess/ and held to a hard gate; a test fails when the two differ.
  - label: Three-valued claim evaluation
    area: Evaluation
    story: story:three-valued-claims
    detail: canon evaluate over a case snapshot and an evidence directory, writing a canon-decision/1 document; scenario CANON-CLAIM-001, also covering CANON-CLAIM-002.
    href: /docs/reference/evaluation
  - label: Evaluation documents
    area: Evaluation
    story: story:three-valued-claims
    detail: canon-case/1, canon-evidence/1, canon-authority/1, canon-decisions/1 and canon-decision/1, and the canon-properties/1 document canon check reads.
    href: /docs/reference/documents
  - label: canon conform run
    area: Evaluation
    story: story:conformance-runner
    detail: Runs canon-conformance/1 scenarios that compile a fixture and evaluate a case, with authority decisions, explicit decisions and an evaluation instant when a step gives them.
    href: /docs/reference/conformance
  - label: Normative conformance suite
    area: Evaluation
    story: story:conformance-suite
    detail: The canon-requirements/1 catalogue lists the CANON-* requirements Canon implements; canon conform run --requirements fails when an implemented one has no passing scenario, a scenario covers one the catalogue omits, or an evaluate step gives another decision when rerun or with its evidence, authority and decisions reversed.
    href: /docs/reference/conformance#the-requirements-catalogue
  - label: Evidence bound to revisions
    area: Evaluation
    story: story:evidence-revision-binding
    detail: Evidence applies only to the current revision of the artifact it names; a record bound to another revision is listed as excluded under each claim that reaches its kind, and one about an undeclared artifact is refused; scenario CANON-EVIDENCE-001.
    href: /docs/reference/evaluation#refusals
  - label: Subject-bound evidence matches
    area: Evaluation
    story: story:subject-bound-evidence-match
    detail: An evidence match may name the artifact its record must be about; a record about another artifact does not match it; scenario CANON-EVIDENCE-003.
    href: /docs/concepts/evidence-and-revisions#evidence-about-one-artifact
  - label: Evidence freshness
    area: Evaluation
    story: story:evidence-freshness
    detail: Evidence older than its kind's max_age at the --at instant is excluded, so a match it alone decided is UNKNOWN rather than FALSE; scenario CANON-EVIDENCE-002.
    href: /docs/reference/evaluation#refusals
  - label: Invalidation rules
    area: Evaluation
    story: story:invalidation-rules
    detail: A rule names an upstream artifact and the claims its revision change invalidates; evidence observed against an earlier revision no longer supports them, and claims built on them follow their predicates; scenario CANON-INVALIDATION-001.
    href: /docs/concepts/evidence-and-revisions#invalidation
  - label: Obligations
    area: Evaluation
    story: story:obligations
    detail: Each obligation is open or discharged by its discharge predicate; scenario CANON-OBLIGATION-001.
    href: /docs/reference/evaluation#sections
  - label: Action admissibility
    area: Evaluation
    story: story:action-admissibility
    detail: Admissible, approval-required or blocked, from preconditions and authority decisions; scenario CANON-AUTHORITY-001.
    href: /docs/reference/evaluation#sections
  - label: Outcomes
    area: Evaluation
    story: story:outcomes
    detail: Legitimate or blocked; no completion through an undeclared or blocked outcome; scenario CANON-OUTCOME-001.
    href: /docs/reference/evaluation#sections
  - label: Decision-based outcomes
    area: Evaluation
    story: story:decision-outcomes
    detail: An outcome may require an explicit decision taken at the current case revision; scenario CANON-OUTCOME-002.
    href: /docs/reference/evaluation#explicit-decisions
  - label: Structured explanation
    area: Evaluation
    story: story:explanation
    detail: Every decision says what it was computed from and why each value is what it is, down to the evidence records that applied or were excluded; scenario CANON-EXPLAIN-001, also covering CANON-DETERMINISM-001.
    href: /docs/reference/evaluation#sections
  - label: canon check
    area: Analysis
    story: story:canon-check
    detail: Every state of a protocol's finite state space; unreachable outcomes, unsatisfiable preconditions, unproduced evidence, authority bypasses with a witness state, and failing properties with a counterexample.
    href: /docs/reference/cli#canon-check
  - label: canon generate
    area: Analysis
    story: story:scenario-generation
    detail: One minimal witness scenario per outcome and per blocked action, which canon conform run runs unchanged.
    href: /docs/reference/cli#canon-generate
  - label: Semantic diff
    area: Analysis
    story: story:semantic-diff
    detail: Classify a protocol change as tightening, relaxation, breaking, expansion or no semantic change.
    href: /docs/reference/cli#canon-diff
  - label: Case inputs and applicable obligations
    area: Language
    story: story:case-inputs
    detail: A protocol declares case inputs with closed value lists; the input predicate and applicable_when let one compiled protocol serve several profiles; scenario CANON-INPUT-001.
    href: /docs/reference/protocol
  - label: Evidence from an independent producer
    area: Language
    story: story:evidence-independence
    detail: An evidence match demands that its records' producer be independent on declared dimensions, which the case resolves for each producer; a record that fails the demand leaves the match UNKNOWN, never FALSE; scenario CANON-INDEPENDENCE-001.
    href: /docs/reference/protocol#evidencematch
  - label: Action argument schemas
    area: Language
    story: story:action-arguments
    detail: An action declares one argument schema in Canon's JSON Schema 2020-12 dialect, which a runner reads and validates calls against; absent, the action takes only {}. canon validate refuses a schema outside the dialect, canon compile carries it unchanged into canon-ir/1 and canon diff classifies its changes.
    href: /docs/concepts/protocols#argument-schemas
  - label: Cases compose at run time
    area: Language
    story: story:case-composition
    detail: An action declares the child case it opens, by protocol and subject (case_open); each child's outcome comes back as one case_outcome record, and the children predicate is TRUE when every child ended with an outcome it lists, FALSE once one ended outside them, UNKNOWN while one is open or none is recorded. A case has one commission; a second party works through a child case. canon validate refuses an opening under the protocol's own id, and a check over a set of protocols refuses openings that form a cycle; Atlas ADR 0081, scenario CANON-COMPOSE-001.
    href: /docs/reference/protocol
  - label: Protocols express step order
    area: Design
    story: story:evidence-order-predicate
    detail: A predicate over evidence order, the first record of a kind and one kind before another; Atlas ADR 0084.
  - label: A record observed after the first of a kind
    area: Language
    story: story:evidence-order-after
    detail: The after order form tests whether a record of one kind with a given result was observed strictly after the first record of another kind, or of the same kind, read from the evidence history like first and before; scenario CANON-ORDER-002.
    href: /docs/reference/protocol
  - label: Order within a second
    area: Language
    story: story:evidence-order-subsecond
    detail: An observed_at may carry a fraction of one to nine digits, and first, before and after compare every instant of one evaluation at the coarsest precision written among its records, so records within one second are ordered when all are written finer and equal instants are not; expiry keeps whole seconds; scenario CANON-ORDER-003.
    href: /docs/reference/documents
  - label: A record observed since the latest of a kind
    area: Language
    story: story:evidence-order-since
    detail: The since order form tests whether a record of one kind with a given result, at the subject revision of the latest record of another kind (or of the same kind), was observed after it, read from the evidence history like the other order forms; scenario CANON-ORDER-004.
    href: /docs/reference/protocol
  - label: ESS specification of the command surface
    area: Language
    story: story:ess-command-surface
    detail: Every canon subcommand is an ESS command and every flag an input, in the domain canon.cli; a test fails when the clap definition and ess/ differ in either direction.
    href: /docs/reference/cli
  - label: Scoped capabilities
    area: Evaluation
    story: story:capability-scope
    detail: Capability requirements and authority decisions carry a scope; default deny, coverage from the wildcard outwards, denied over require_approval over granted; scenario CANON-SCOPE-001.
    href: /docs/reference/evaluation#sections
  - label: Protocol imports
    area: Language
    story: story:protocol-imports
    detail: A protocol imports others, each pinned to a revision and the sha256 digest of its compiled canon-ir/1, and compiles with exactly the documents passed with --import into one closed canon-ir/1 that names the root only; a redeclaration replaces an imported declaration only when the import lists it under refines, and a missing or unused document, a pin mismatch, a cycle and two differing declarations are refused; scenario CANON-IMPORT-001.
    href: /docs/reference/canon-ir
  - label: canon check over subject slices
    area: Analysis
    story: story:check-subject-slices
    detail: Each outcome, action and property is decided over the dimensions it reads, so the bound of 65536 states holds each slice, not the whole product; the report is byte-identical to the whole product's, and a slice above the bound refuses the check naming its subject.
    href: /docs/reference/cli#canon-check
  - label: Evaluation cost under invalidation rules
    area: Evaluation
    story: story:invalidation-evaluation-cost
    detail: Evaluating claims kept apart by invalidation rules is at most quadratic in the claim count, and validating them linear; a chain of 4000 claims evaluates within a time budget in the test suite, with every decision byte-identical to before.
    href: /docs/reference/evaluation
  - label: Authority bound to a case revision
    area: Evaluation
    story: story:authority-revision-binding
    detail: A canon-authority/1 entry may give the case revision it was taken at and the principal who took it; a bound entry, whatever its decision, applies only while the case is at that revision and takes no part in coverage or precedence otherwise, an unbound one applies at every revision, and the principal is recorded as given; scenario CANON-AUTHORITY-002.
    href: /docs/reference/documents#authoritydecision
  - label: Supplied evidence
    area: Language
    story: story:supplied-evidence
    detail: An evidence kind may name, as supplied_by, another protocol whose cases produce its records; canon check counts it as produced, without authority, and a record of it copied unchanged from the supplier's case may name upstream artifacts only the supplier declares, carried and not read; the protocol's own id is refused as self-supplied-evidence; scenario CANON-SUPPLY-001.
    href: /docs/reference/protocol
  - label: Child outcomes bound to the current revision
    area: Language
    story: story:child-outcome-revision
    detail: "The children predicate takes revision: current, and then reads only the case_outcome records about the case's current revision of their subject. A record about an earlier revision neither establishes nor contradicts it, so a parent whose subject is revised after its children ended falls back to UNKNOWN until a child about the new revision ends. Without the key, or with revision: any, every record counts as before, and canon-ir/1 is unchanged; scenario CANON-COMPOSE-002."
    href: /docs/reference/protocol#childrevision
  - label: Missing evidence
    area: Evaluation
    story: story:missing-evidence
    detail: canon-decision/1 may carry a missing_evidence section that maps each admissible action whose may_produce is not empty to the kinds of that list with no applicable record, in kind order; a record is applicable when the revision-binding and freshness stages leave it and no claim lists it in excluded_evidence, whatever its result and whether or not its kind declares supplied_by, and the section is absent when no action qualifies; scenario CANON-FRONTIER-001.
    href: /docs/reference/documents#decision
  - label: Judgement marks
    area: Language
    story: story:judgement-marking
    detail: "An action may declare author (program or judgement, absent program) and revises, the declared artifacts it may move to a new revision; each may_produce entry may declare decided_by, absent the action's author. canon validate refuses an undeclared artifact in revises as undeclared-artifact, canon-ir/1 writes each field only when it marks judgement or lists an artifact, so every existing IR is unchanged, and canon diff classifies author and decided_by turning to judgement as TIGHTENING and an artifact added to revises as RELAXATION. No evaluation meaning: canon evaluate, check and generate give the same bytes with or without them."
    href: /docs/reference/protocol#author
  - label: Pending decisions
    area: Evaluation
    story: story:pending-decisions
    detail: "canon-decision/1 may carry a pending_decisions section listing the decisions the evaluation waits on: under authority, one entry per requirement an approval-required action names as none or require_approval, with the case revision and the options granted and denied, by action, capability and scope; under decisions, one entry per outcome blocked for want of an explicit decision, with the option taken, or none for a snapshot without a revision. Computed from the actions and outcomes sections and the case revision; a blocked action has no entry, and the section is absent when nothing is pending; scenario CANON-PENDING-001."
    href: /docs/reference/documents#decision
  - label: canon simulate
    area: Analysis
    story: story:canon-simulate
    detail: A breadth-first walk over every state a case can reach from the empty case, by steps that add one record an admissible action may produce or a supplied record, let a record of a kind with max_age expire (an expired child outcome still counts for a children form), grant or deny a capability, or take a decision; it reports each stuck state and cycle once at its smallest state with the shortest path, the decisions that would end it and how many such states contain it, plus dead actions and unreached outcomes, counts states waiting on supplied evidence or expiry, states on its own line that a child case's outcome is walked only as a step of its opening action, and refuses order forms and a walk above 65536 reachable states.
    href: /docs/reference/cli#canon-simulate
  - label: Check a call's arguments
    area: Language
    story: story:argument-validator
    detail: The library function b10x_canon::validate::check_arguments checks one call's arguments against an action's argument schema with JSON Schema 2020-12 meaning, reports every refusal at its JSON Pointer in document order and compares minimum and maximum exactly; a schema outside the dialect is returned as canon validate reports it. Canon still evaluates no call.
    href: /docs/reference/validation#the-argument-schema-dialect
  - label: Re-delivered evidence
    area: Evaluation
    story: story:evidence-redelivery
    detail: "An evidence record given more than once in one evaluation counts once when every copy equals the first (kind, result, subject, subject revision, observed_at as written text, producer, child case and upstream revisions as the same pairs in any order), so a runner that delivers at least once can evaluate its stored inputs again and the decision, explanation included, is byte-identical to the one without the copy. A copy that differs is refused as duplicate-identifier, naming the record and, in canon evaluate, every file holding it. No field, command or flag changes, and the duplicate rules for decisions and authority entries stay; scenario CANON-EVIDENCE-004."
    href: /docs/concepts/evaluation
  - label: Decision grounds
    area: Evaluation
    story: story:decision-grounds
    detail: "An entry of canon-authority/1 or canon-decisions/1 may name ground_revisions, the artifact revisions it rested on, and ground_evidence, the evidence records it rested on. canon evaluate applies the entry only while every ground holds: an artifact still at that revision, a record still applicable as missing_evidence defines it, so expiry and invalidation reach a decision through its records. A requirement or outcome left undecided by set-aside entries keeps its existing reason and lists the failed grounds under stale_grounds; a set-aside denial lapses too. computed_from records the grounds as given; an undeclared ground artifact is refused as undeclared-artifact; scenario CANON-GROUND-001."
    href: /docs/reference/documents#authoritydecision
  - label: canon simulate child outcomes
    area: Analysis
    story: story:simulate-child-outcome-step
    detail: canon simulate lets a child case's outcome arrive at any step after the action that opened the child was taken, as a step of its own that no action takes; a terminal outcome replaces the child's open record, a state names each opening action taken on its way, states waiting on a child outcome are counted with those waiting on supplied evidence or expiry, and the line naming the earlier limit on child outcomes is gone.
    href: /docs/reference/cli#canon-simulate
  - label: Child outcomes about one artifact
    area: Language
    story: story:child-outcome-subject
    detail: "The children predicate takes subject: <artifact>, and then reads only the case_outcome records about that artifact, with revision: current only those at its current revision. A record about another artifact neither establishes nor contradicts it, so children opened about different artifacts no longer mix in one form. canon validate refuses an undeclared subject as undeclared-artifact; without the key every record counts as before and canon-ir/1 is unchanged; scenario CANON-COMPOSE-003."
    href: /docs/reference/protocol#childoutcomes
  - label: Write a protocol/1 model
    area: Language
    story: story:protocol-writer
    detail: The library function b10x_canon::model::write writes any protocol/1 model as canonical JSON text that model::parse reads back to an equal model, declaration order and repeated identifiers kept, a key left out only when the model holds none; it writes a model the validator refuses, and canon validate stays the only judge of validity. No builder, no canon fmt, no change to canon-ir/1.
    href: /docs/reference/protocol
  - label: Kinds recorded together
    area: Analysis
    story: story:simulate-record-groups
    detail: "An action may declare records_together, groups of the kinds one run of it records all together or not at all. canon simulate then adds a group's records in one step, one record of each member kind in every combination of dimension, class and producer profile, printed as one line, and never offers a grouped kind alone. canon validate refuses a group with fewer than two distinct kinds, a kind outside may_produce, a kind in two groups of one action and case_outcome on an action that opens a child case, each as invalid-record-group naming the action. No evaluation reads it: canon evaluate, check and generate give the same bytes, canon diff reports a group as NO SEMANTIC CHANGE, and canon-ir/1 writes the key only when a group is declared."
    href: /docs/reference/protocol#action
  - label: canon simulate revise step
    area: Analysis
    story: story:simulate-revise-step
    detail: "canon simulate lets an admissible action move the artifacts it declares in revises to a new revision, one step per non-empty subset, alone or with one record or one group it may produce, printed as action x revises a. A revision removes the current records about the artifact, keeps a child's outcome about it as an earlier record a children form still reads, and turns a record with that artifact upstream into one observed before it moved, which its invalidation rules set aside; the case revision never moves, so a denial lasts. A cycle now asks only that every record step return the state, and one a revision leads out of says so: every revision by action x leads to a state no outcome is reachable from. A protocol without revises walks as before."
    href: /docs/reference/cli#canon-simulate
  - label: Protocol floor
    area: Analysis
    story: story:protocol-floor
    detail: canon floor --floor --ir checks that a compiled protocol stays above an organization floor, a protocol/1 document of its own id and revision; it classifies every change from the floor to the protocol as canon diff does, prints floor holds and the counts when each is tightening, expansion or no semantic change, and otherwise prints each relaxation and breaking change and exits 1.
    href: /docs/reference/cli#canon-floor
  - label: canon mutate
    area: Analysis
    story: story:canon-mutate
    detail: "canon mutate --path <protocol> --scenarios <dir> measures how strong a scenario set is: five operators (drop a member of an all, all to any, remove a precondition, remove a capability requirement, change an evidence result to another the protocol names for that kind) make each mutant from the parsed model, written with model::write; each runs against the scenarios that name the protocol file and is classified with the semantic diff. A mutant some scenario fails is killed, one none fails survived, and a survivor whose diff holds a RELAXATION is a weak point; a mutant the compiler refuses is invalid with its codes. Exit 1 when a weak point is reported, 0 otherwise; a set in which no scenario names the protocol file, or that fails on the protocol itself, is refused. Mutants come in a fixed order, so two runs give the same bytes."
    href: /docs/reference/cli#canon-mutate
  - label: An item's result across descended revisions
    area: Language
    story: story:revision-ordering
    detail: The descended order form tests whether an item that had one result on a revision the current revision of its subject descends from has another on the current revision, pairing evidence records on their item and reading descent from the case snapshot's descends_from of each artifact; scenario CANON-ORDER-005.
    href: /docs/reference/protocol
  - label: canon simulate walks a parent's recovery
    area: Analysis
    story: story:child-outcome-recovery
    detail: "canon simulate keeps one case_outcome dimension for each case_open subject when the protocol's children forms name no subject, so a revision of an artifact sets aside only the child outcomes about it, written evidence case_outcome about b; a child outcome about any other artifact stays current. A child that has not ended when its subject is revised may end against the earlier revision: its outcome then arrives as an earlier record, written a child of action x records … earlier, as well as a current one. A parent that revises the artifact a failed child was about and opens new children is therefore walked to the outcome a children form with revision: current reads. A protocol with no case_open, or with one case_open subject that is the artifact the space already uses, walks as before. CANON-COMPOSE-002 gains the step that pins the recovery."
    href: /docs/reference/cli#canon-simulate
  - label: Conditional decision
    area: Language
    story: story:decision-condition
    detail: "An outcome that requires an explicit decision may carry an optional when predicate, requires: {decision: withdraw, when: {claim: publication.refused}}. The decision counts toward the outcome only while when is true at the evaluation, whenever the decision was taken: while when is false or unknown the outcome is blocked by the reasons a precondition that is not true gives, a decision supplied is neither counted nor refused (computed_from.decisions still lists it), and no pending decision is listed; while it is true the outcome is as before, legitimate with decided_by or blocked naming the decision. when holds claims and case inputs only, as applicable_when does: canon validate refuses an evidence match, an order form or a children form in it as evidence-in-decision-condition, naming the outcome. canon-ir/1 writes when only when it is present, so every protocol written without it compiles to the same bytes; canon diff reports adding, removing or changing it as BREAKING, and canon check decides the outcome over the decision's dimension and what when reads. The condition is not an order: Canon cannot tell a decision taken before when turned true from one taken after."
    href: /docs/reference/protocol#outcome
  - label: Artifacts revised by another protocol
    area: Analysis
    story: story:artifact-revised-by
    detail: "An artifact of protocol/1 can name the protocol whose cases revise it with revised_by, one protocol id; canon validate refuses the protocol's own id as self-revised-artifact and any other id is valid and resolved by nothing. canon-ir/1 writes revised_by after the artifact's description only when it is set, so the IR and digest of every protocol without it stay as they were, and the IR read-back refuses a non-string and the own id. canon evaluate, canon check and canon generate give the same bytes with or without it, and canon diff reports adding, removing or replacing it as NO SEMANTIC CHANGE. canon simulate offers a revise step for the artifact in every state, printed as protocol q revises a, after the supplied steps and before the expiry steps; a state only that step can open counts as waiting and is no finding, and the summary of a protocol with such an artifact says waiting on supplied evidence, expiry or a revision by another protocol. Canon revises nothing and nothing checks that the named protocol revises the artifact."
    href: /docs/reference/cli#canon-simulate
  - label: canon check-set
    area: Analysis
    story: story:check-across-protocol-files
    detail: "canon check-set --path <file>, repeatable, checks the references between protocol files: an opened protocol that is no file of the set, a child outcome a protocol names about a subject that no protocol it opens on that subject declares, a supplier that is no protocol of the set or has no action whose may_produce lists the supplied kind, two files with one protocol id and a cycle of openings. Exit 0 clean, 1 on a finding, 2 on a file that cannot be read. canon check and canon simulate read one file and are unchanged."
    href: /docs/reference/cli#canon-check-set
  - label: canon simulate opens a child with its record
    area: Analysis
    story: story:simulate-opens-child-with-its-record
    detail: "canon simulate opens a child together with its running case_outcome record open, as the runner writes it, so an outcome that waits for a child to end is reached only through the states the runner reaches. The walk of a protocol with several opening actions is smaller (one consumer protocol 24410 states to 1431) and an outcome that required an open child record is no longer reported unreached."
    href: /docs/reference/cli#canon-simulate
  - label: canon simulate ends a refused approval by a decision
    area: Analysis
    story: story:refused-approval-is-not-stuck
    detail: "A state in which a denied capability blocks an action and a decision step leads to a legitimate outcome is no stuck-state or cycle finding; the summary counts it as ending by a decision after a denial. A finding that holds a denial names the action it blocks and the two forms that end the case, an outcome with requires decision and when, or an action without the capability whose record an outcome reads."
    href: /docs/reference/cli#canon-simulate
  - label: Ordering guards proven by canon check
    area: Analysis
    story: story:ordering-guards-provable-by-check
    detail: "An action names a guard with runs_only_when; canon check proves that every state in which the action can run satisfies it, and reports ordering-guard-failed where it does not. evaluate, simulate and generate never read it."
    href: /docs/concepts/protocols
  - label: Supplied evidence required at case open
    area: Analysis
    story: story:supplied-evidence-required-at-open
    detail: "An evidence kind with required_at_open must be current when a child case opens; canon check-set reports unsupplied-at-open for an opening action whose precondition does not imply it, and canon simulate starts each case with the record."
    href: /docs/reference/protocol
  - label: A children form counts its child cases
    area: Language
    story: story:children-form-counts-unopened-children
    detail: "count: N on a children form waits for N child cases ended with a listed outcome: unknown while fewer are read or one is open, false when one ended outside the list. 0 is refused; canon simulate refuses a count above 64."
    href: /docs/reference/protocol
  - label: Approvals bound to evidence content
    area: Evaluation
    story: story:evidence-digest-binds-approvals
    detail: "A ground_evidence entry of canon-authority/1 or canon-decisions/1 may carry digest: sha256:<hex>; when the record under that ID has other contents the ground fails as content_changed. canon digest --evidence <file> prints the digest. Requirement CANON-GROUND-002."
    href: /docs/reference/evaluation
  - label: Trigger rule documents
    area: Language
    story: story:trigger-rule-document
    detail: "canon-trigger/1 declares one rule: the kind, state and declared row fields it watches, a canon-expr/1 where over $row compiled against a catalog of only contains and present_<type>, the protocol it starts with inputs from a field or a constant, and its mode, access, refire and cap. canon trigger validate --path prints the rule key <id>@<version> or names the field of each error. Requirements CANON-TRIGGER-001 to 003."
    href: /docs/reference/trigger-rules
  - label: Protocol access class and guard
    area: Language
    story: story:protocol-access-class
    detail: "An action may declare access: read_only or write, write when absent; canon validate refuses read_only on an action that revises or opens a case (read-only-action-writes). canon-ir/1 carries access_class, read_only when every action is, and guarded, true when an action has a non-empty requires. canon trigger protocols --path prints a canon-trigger-protocols/1 document mapping each protocol id to its class, guard and inputs. Requirements CANON-TRIGGER-004 to 006."
    href: /docs/reference/trigger-rules#the-protocols-a-rule-is-checked-against
  - label: Trigger rule evaluation
    area: Evaluation
    story: story:trigger-evaluate
    detail: "canon trigger evaluate reads a canon-trigger-set/1 rule set (each rule file with its state draft, active or disabled), a canon-trigger-snapshot/1 snapshot, the protocols, a canon-trigger-history/1 history and --now, and prints a canon-trigger-plan/1 plan: every match with its input, its firing id and a verdict, would-start, offer, baseline, undetermined (field-missing, field-type, where-unknown) or refused (entered-at-missing), byte-identical whatever the input order, with no clock, network or other file. Requirements CANON-TRIGGER-007 to 011."
    href: /docs/reference/trigger-rules#evaluating-a-rule-set
  - label: Linux x86_64 release archives
    area: Distribution
    story: story:linux-release-archives
    detail: "canon-<version>-x86_64-unknown-linux-gnu.tar.gz, linked against glibc 2.17 at most, and canon-<version>-x86_64-unknown-linux-musl.tar.gz, static, with SHA256SUMS: built by package.yml and task package with cargo-zigbuild, the glibc floor checked with objdump -T and the static link with readelf -l, each archived binary run over the conformance suite. Attached to the GitHub Release from the next release."
    href: /docs/getting-started#linux-binaries
  - label: Trigger holds and refusals
    area: Evaluation
    story: story:trigger-holds-and-refusals
    detail: "canon trigger evaluate refuses what the rule set does not allow, the first reason that applies: a disabled rule, a protocol not in the protocols (unknown-protocol), a guarded protocol in auto (guarded-auto), an access other than the protocol's class (access-mismatch), a write rule in auto without an approval of its exact rule key in the history (write-unapproved). It holds a match whose firing id the history records (already-fired), and one whose rule has reached its cap of firings on the UTC day of --now, counted from the history and then from the plan's earlier would-start entries (cap-reached). Requirements CANON-TRIGGER-012 to 015."
    href: /docs/reference/trigger-rules#evaluating-a-rule-set
  - label: Trigger rule publication
    area: Analysis
    story: story:trigger-rule-publication
    detail: "canon trigger check-set --path <rule> ... --published <index> --protocols <file> checks a rule set before it is published and prints its canon-trigger-index/1 index, each rule key with its digest (canon trigger digest --path: sha256 of the RFC 8785 JSON of the rule's canonical form). It fails naming the rule key: key-republished (the index holds the key with another digest; a published rule is immutable), duplicate-key, unknown-protocol, guarded-auto, unknown-input, missing-input and input-value-not-allowed (a constant outside the input's values, or a field that is not a declared string). canon trigger evaluate refuses a row whose mapped value is not among the input's values (input-value-not-allowed). Requirements CANON-TRIGGER-016 to 021."
    href: /docs/reference/trigger-rules#publishing-a-rule-set
