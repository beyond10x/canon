format: canon-conformance/1
id: CANON-EVIDENCE-001
covers: [CANON-EVIDENCE-001]
fixture: fixtures/investigation/evidence-revision-binding.yaml
steps:
  # The evidence is bound to the current revision of the explanation: it establishes the claim.
  - id: bound-to-current
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # Only the case snapshot changed: the explanation is now at r2 and the same evidence is still
  # bound to r1. It no longer applies, so the claim is UNKNOWN, not FALSE, and each record is
  # listed as excluded for a revision mismatch.
  - id: subject-advanced
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r2}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "excluded_evidence": [
                {
                  "evidence": "falsification-1",
                  "reason": "revision_mismatch"
                },
                {
                  "evidence": "observation-1",
                  "reason": "revision_mismatch"
                }
              ],
              "value": "unknown"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # A record about an artifact the protocol does not declare is bound to nothing the case can
  # name a revision of: it is refused, naming that subject.
  - id: undeclared-subject
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: hypothesis
          subject_revision: r1
    expect:
      refusal: undeclared-artifact
