          "actions": {
            "merge": {
              "reasons": [
                {
                  "result": "failed",
                  "since": "tests_change",
                  "subject": "change",
                  "then": "test_result",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            }
          },
          "claims": {
            "passes": {
              "excluded_evidence": [
