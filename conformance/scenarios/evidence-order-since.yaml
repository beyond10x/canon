                  "evidence": "t1",
                  "reason": "revision_mismatch"
                }
              ],
              "value": "true"
            },
            "red.since.change": {
              "value": "unknown"
            },
            "red.since.run": {
              "value": "false"
            }
          },
          "outcomes": {
            "done": {
              "reasons": [
                {
                  "claim": "red.since.change",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            }
          }
        }

  # Expectation 6, second half. A tests_change without observed_at: which tests_change is the
  # latest, and what follows it, is not established: UNKNOWN, though a failed run at its revision
  # has an instant.
  - id: a-tests-change-without-observed-at
    evaluate:
      case:
        format: canon-case/1
        id: TF-1
        protocol: red-since-change
        artifacts:
          change: {revision: h3}
      evidence:
