  # Expectation 8. One kind: a run at h1 passed, and the last run, at h2, failed alone. Its latest
  # test_result is that failed run, and a record is not later than itself: red.since.run is FALSE,
  # where `after` over the first test_result would be TRUE. With no tests_change, red.since.change
  # is UNKNOWN; passes is FALSE, which is what blocks the action and the outcome.
  - id: one-kind-the-last-run-failed-alone
    evaluate:
      case:
        format: canon-case/1
