                  "claim": "red.since.change",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            }
          }
        }

  # Expectation 7. Two tests_change records at one instant, at h2 and at h3, so either may be the
  # latest; a run failed after both, at h3 only. The anchor at h3 gives TRUE and the one at h2
  # FALSE, so `since` is UNKNOWN.
  - id: two-latest-changes-at-one-instant
    evaluate:
      case:
        format: canon-case/1
        id: TF-1
        protocol: red-since-change
        artifacts:
          change: {revision: h4}
      evidence:
        - format: canon-evidence/1
