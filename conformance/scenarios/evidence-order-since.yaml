          subject: change
          subject_revision: h2
          observed_at: 2026-10-01T09:00:00Z
        - format: canon-evidence/1
          id: t2
          kind: test_result
          result: passed
          subject: change
          subject_revision: h3
          observed_at: 2026-10-01T10:00:00Z
    expect:
      decision: |
