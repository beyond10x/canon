format: canon-conformance/1
id: CANON-REASONS-001
covers: [CANON-EVIDENCE-003]
fixture: fixtures/investigation/subject-bound-reasons.yaml
# The reason shape of an evidence match that names its subject, in the `actions` and `outcomes`
# sections (story:review-hardening-w7): `{"evidence": <kind>, "present": <bool>, "subject":
# <artifact>}`. The fixture declares two artifacts, explanation and dataset; action publish and
# outcome accepted require a surviving attempt about the explanation, action retract and outcome
# rejected a refuting one, so each section shows `present` both false and true. `present` is
# whether a record the match reads applies: a record about the dataset is not read by a match bound
# to the explanation, so it leaves `present` false. The explanation section is not compared here;
# CANON-EXPLAIN-001 holds it.
steps:
  # A surviving attempt about the dataset, at its current revision. No record about the
  # explanation exists, so every section is blocked by the subject-bound match with `present`
  # false, and the claim bound to the explanation is UNKNOWN.
  - id: about-another-artifact
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
          dataset: {revision: d1}
      evidence:
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: dataset
          subject_revision: d1
    expect:
      decision: |
        {
          "actions": {
            "publish": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": false,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            },
            "retract": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": false,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            }
          },
          "case": "INV-18",
          "claims": {
            "explanation.survived": {
              "value": "unknown"
            }
          },
          "format": "canon-decision/1",
          "outcomes": {
            "accepted": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": false,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            },
            "rejected": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": false,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            }
          },
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # The same attempt about the explanation. Publish is admissible and accepted legitimate; the
  # matches of retract and rejected read the record, which has another result, so `present` is true
  # in both sections.
  - id: about-the-subject
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
          dataset: {revision: d1}
      evidence:
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "actions": {
            "publish": {
              "status": "admissible"
            },
            "retract": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": true,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            }
          },
          "case": "INV-18",
          "claims": {
            "explanation.survived": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "outcomes": {
            "accepted": {
              "status": "legitimate"
            },
            "rejected": {
              "reasons": [
                {
                  "evidence": "falsification_attempt",
                  "present": true,
                  "subject": "explanation"
                }
              ],
              "status": "blocked"
            }
          },
          "protocol": "investigation",
          "protocol_revision": 1
        }
