format: canon-conformance/1
id: CANON-EVIDENCE-004
covers: [CANON-EVIDENCE-004, CANON-DETERMINISM-001]
fixture: fixtures/investigation/evidence-redelivery.yaml
# A runner that delivers at least once may hand Canon the same evidence record twice
# (story:evidence-redelivery). A record given more than once counts once when each copy equals
# the first; a copy that differs is refused as `duplicate-identifier`.
#
# Two records are equal when `kind`, `result`, `subject`, `subject_revision`, `producer` and
# `child_case` are equal as written, `observed_at` is equal as written text, and
# `upstream_revisions` holds the same pairs in any order. `observed_at` is compared as text:
# `12:00:00Z` and `12:00:00.000Z` differ, because the precision of an instant sets the resolution
# at which records are ordered.
#
# The fixture declares the artifacts findings, source and data; the evidence kinds review, scan
# and case_outcome; and the claims findings.reviewed (a review approved) and findings.resolved
# (every child case accepted or declined). Record e1 is a review, approved, about findings at f1,
# made against source s1 and data d1; e2 is a scan of the source; o1 is the outcome of the child
# case CHG-1. Each step that expects `decision` expects the whole decision, so the steps that
# repeat a decision expect the same bytes: the decision with a copy is the decision without it,
# explanation included, and `computed_from.evidence` lists each id once. The determinism check of
# `canon conform run --requirements` runs every step again with its evidence reversed, which moves
# each copy from after the record to before it.
steps:
  # The control: two records, each given once. Every step below that expects a decision expects
  # these bytes.
  - id: single
    evaluate:
      case:
        format: canon-case/1
        id: RV-7
        protocol: redelivery
        artifacts:
          findings: {revision: f1}
          source: {revision: s1}
          data: {revision: d1}
      evidence:
        - format: canon-evidence/1
          id: e1
          kind: review
          result: approved
          subject: findings
          subject_revision: f1
          observed_at: 2026-11-20T12:00:00Z
          upstream_revisions:
            source: s1
            data: d1
          producer: reviewer-a
        - format: canon-evidence/1
          id: e2
          kind: scan
          result: clean
          subject: source
          subject_revision: s1
    expect:
      decision: |
        {
          "actions": {
            "close": {
              "reasons": [
                {
                  "children": [
                    "accepted",
                    "declined"
                  ],
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            },
            "open_change": {
              "reasons": [
                {
                  "capability": "case.open",
                  "decision": "none"
                }
              ],
              "status": "approval-required"
            },
            "request_review": {
              "status": "admissible"
            }
          },
          "case": "RV-7",
          "claims": {
            "findings.resolved": {
              "value": "unknown"
            },
            "findings.reviewed": {
              "value": "true"
            }
          },
          "explanation": {
            "actions": {
              "close": {
                "because": [
                  {
                    "children": [
                      "accepted",
                      "declined"
                    ],
                    "value": "unknown"
                  }
                ],
                "status": "blocked"
              },
              "open_change": {
                "because": [
                  {
                    "capability": "case.open",
                    "decision": "none"
                  }
                ],
                "status": "approval-required"
              }
            },
            "claims": {
              "findings.resolved": {
                "because": [
                  {
                    "children": [
                      "accepted",
                      "declined"
                    ],
                    "value": "unknown"
                  }
                ],
                "value": "unknown"
              }
            },
            "computed_from": {
              "case": {
                "artifacts": {
                  "data": {
                    "revision": "d1"
                  },
                  "findings": {
                    "revision": "f1"
                  },
                  "source": {
                    "revision": "s1"
                  }
                },
                "format": "canon-case/1",
                "id": "RV-7",
                "protocol": "redelivery"
              },
              "evidence": [
                "e1",
                "e2"
              ],
              "protocol": "redelivery",
              "protocol_revision": 1,
              "semantics": {
                "canon": "0.13.0",
                "format": "canon-decision/1"
              }
            },
            "outcomes": {
              "resolved": {
                "because": [
                  {
                    "claim": "findings.resolved",
                    "value": "unknown"
                  }
                ],
                "status": "blocked"
              }
            }
          },
          "format": "canon-decision/1",
          "missing_evidence": {
            "request_review": []
          },
          "outcomes": {
            "resolved": {
              "reasons": [
                {
                  "claim": "findings.resolved",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            },
            "reviewed": {
              "status": "legitimate"
            }
          },
          "pending_decisions": {
