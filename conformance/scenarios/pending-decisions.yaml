                  "granted",
                  "denied"
                ]
              }
            ],
            "decisions": [
              {
                "case_revision": "c2",
                "decision": "explicitly_abandoned",
                "options": [
                  "taken"
                ],
                "outcome": "abandoned"
              },
              {
                "case_revision": "c2",
                "decision": "explicitly_inconclusive",
                "options": [
