                  "decision": "none",
                  "scope": {
                    "cluster": "prod-eu",
                    "namespace": "foo"
                  }
                }
              ],
              "status": "approval-required"
            },
            "publish": {
              "reasons": [
                {
                  "capability": "metrics.read",
                  "decision": "none",
                  "scope": {
                    "cluster": "prod-eu"
                  }
                },
                {
                  "capability": "report.write",
                  "decision": "none"
                }
              ],
              "status": "approval-required"
            }
          },
          "outcomes": {
            "abandoned": {
              "reasons": [
                {
                  "decision": "explicitly_abandoned",
                  "present": false
                }
              ],
              "status": "blocked"
            },
            "inconclusive": {
              "reasons": [
                {
                  "decision": "explicitly_inconclusive",
                  "present": false
                }
