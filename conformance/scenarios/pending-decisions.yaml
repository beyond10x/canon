                }
              },
              {
                "action": "compare",
                "capability": "metrics.read",
                "case_revision": "c2",
                "current": "none",
                "options": [
                  "granted",
                  "denied"
                ],
                "scope": {
                  "namespace": "bar"
                }
              },
              {
                "action": "inspect",
                "capability": "metrics.read",
                "case_revision": "c2",
                "current": "none",
                "options": [
                  "granted",
                  "denied"
                ],
                "scope": {
                  "cluster": "prod-eu",
                  "namespace": "foo"
                }
              },
              {
                "action": "publish",
                "capability": "metrics.read",
                "case_revision": "c2",
                "current": "none",
                "options": [
                  "granted",
                  "denied"
                ],
                "scope": {
                  "cluster": "prod-eu"
                }
              },
              {
                "action": "publish",
                "capability": "report.write",
