format: canon-conformance/1
id: CANON-PENDING-001
covers: [CANON-PENDING-001]
fixture: fixtures/investigation/pending-decisions.yaml
# Pending decisions (story:pending-decisions). The decision's `pending_decisions` section lists the
# decisions the evaluation waits on, each a canon-authority/1 or canon-decisions/1 entry that would
# change a status in the same decision, computed from the inputs `canon evaluate` already takes.
#
# - `authority` holds one entry per reason `{"capability", "decision": "none" | "require_approval",
#   "scope"?}` of an `approval-required` action of the `actions` section: `{"action",
#   "capability", "scope"?, "current", "case_revision"?, "options": ["granted", "denied"]}`.
#   `current` is the reason's decision, `scope` is written when the requirement has one and
#   `case_revision` is the case snapshot's `revision`, written when it has one. A `blocked` action
#   has no entry. Entries are ordered by action id, then capability, then scope: no scope first,
#   then two scopes by their key-value pairs in key order, compared pair by pair, key before value,
#   by code point, a scope that is a prefix of the other first.
# - `decisions` holds one entry per outcome blocked with the reason `{"decision": <name>,
#   "present": false}`: `{"outcome", "decision", "case_revision"?, "options"}`, in outcome-id order.
#   `options` is `["taken"]` when the snapshot has a revision, and `[]`, with no `case_revision`,
#   when it has none.
# - Each of the two is written only when it has an entry.
#
# The fixture declares four actions and two outcomes. `inspect` requires metrics.read at `{cluster:
# prod-eu, namespace: foo}`. `compare` requires metrics.read at five scopes, declared out of order:
# `{namespace: bar}`, `{cluster: prod-us}`, `{cluster: prod-eu, namespace: foo}`, none and
# `{cluster: prod-eu}`; their order in the section is none, `{cluster: prod-eu}`, `{cluster:
# prod-eu, namespace: foo}`, `{cluster: prod-us}`, `{namespace: bar}`, which a comparison of values
# before keys, or of the scopes' sizes, would not give. `publish` requires report.write, declared
# first, and metrics.read at `{cluster: prod-eu}`. `escalate` requires pager.send, and its
# precondition, the claim anomaly.reported, is true only with an anomaly_report record. The outcomes
# `inconclusive` and `abandoned`, declared in that order, require the explicit decisions
# `explicitly_inconclusive` and `explicitly_abandoned`.
#
# Every step lists `actions`, `outcomes` and `pending_decisions`, so each entry stands beside the
# reason it comes from, except the last, which lists every other section. That the section is
# absent when nothing is pending is not a step's expectation: the runner fails a listed section the
# decision does not carry and compares no section it does not list. The absence is held by the unit
# tests of crates/canon/src/eval/pending.rs and by crates/canon/tests/pending_decisions.rs. The
# case snapshot is at revision c2 unless a step says otherwise.
steps:
  # Expectation 1. No authority and no decisions. Every requirement of the three actions whose
  # precondition holds is not decided, so each is listed with `current: none`, in action, then
  # capability, then scope order; `escalate` is blocked by its precondition and has no entry. Both
  # outcomes are blocked for want of a decision and are listed, `abandoned` first.
  - id: nothing-given
    evaluate:
      case:
        format: canon-case/1
        id: OPS-7
        protocol: operations
        revision: c2
        artifacts:
          service: {revision: s1}
      evidence: []
    expect:
      decision: |
        {
          "actions": {
            "compare": {
              "reasons": [
                {
                  "capability": "metrics.read",
                  "decision": "none"
                },
                {
                  "capability": "metrics.read",
                  "decision": "none",
                  "scope": {
                    "cluster": "prod-eu"
                  }
                },
                {
                  "capability": "metrics.read",
                  "decision": "none",
                  "scope": {
                    "cluster": "prod-eu",
                    "namespace": "foo"
                  }
                },
                {
                  "capability": "metrics.read",
                  "decision": "none",
                  "scope": {
                    "cluster": "prod-us"
                  }
                },
