format: canon-conformance/1
id: CANON-COMPOSE-004
covers: [CANON-COMPOSE-004]
fixture: fixtures/investigation/simulate/children-count/protocol.yaml
# Five readers a to e, each opened once about `sources` (each opener needs its own `*_opened`
# record unknown), and a merge about `merged`. Claim readers.complete is
# `{children: {in: [complete], subject: sources, count: 5}}` and readers.ended the same over
# `[complete, partial]`; action merge.open writes the first form in its precondition. Over the
# records a form reads it is FALSE once a record names an outcome neither listed nor `open`;
# otherwise UNKNOWN while a child is open or while it reads fewer than five records, and TRUE when
# it reads five or more, each listed. A reader not yet opened has no record, so four readers that
# ended complete leave both claims UNKNOWN: without `count` they were TRUE there, and outcome
# `early` was legitimate. The case has `sources` at s1 and `merged` at m1; every record is about
# the current revision. Expectation 8, a count of 0 refused as zero-child-count, is a protocol
# canon validate refuses, which no step compiles: crates/canon/tests/children_count.rs states it.
steps:
  # Expectation 1. `"count": 5` is written in each form that declares it, before `"in"`, as
  # canonical JSON orders keys; the IR is otherwise the one the protocol had without the key.
  - id: compile
    compile: {}
    expect:
      canon-ir: |
        {
          "actions": {
            "a.open": {
              "case_open": {
                "protocol": "reader",
                "subject": "sources"
              },
              "description": "Open reader a, once.",
              "effect": null,
              "may_produce": [
                {
                  "evidence": "a_opened"
                }
              ],
              "precondition": {
                "claim": {
                  "id": "a.opened",
                  "is": "unknown"
                }
              },
              "requires": []
            },
            "b.open": {
              "case_open": {
                "protocol": "reader",
                "subject": "sources"
              },
              "description": "Open reader b, once.",
              "effect": null,
              "may_produce": [
                {
                  "evidence": "b_opened"
                }
              ],
              "precondition": {
                "claim": {
                  "id": "b.opened",
                  "is": "unknown"
                }
              },
              "requires": []
            },
            "c.open": {
