        where: 'present_integer($row.note)'
        start:
          protocol: send-reminder
        mode: offer
        access: write
        refire: once_per_state_entry
        cap: 50
    expect:
      refused: where

  - id: state-field-undeclared
    trigger-validate:
      document: |
        format: canon-trigger/1
        id: stale-invoice-reminder
        version: 3
