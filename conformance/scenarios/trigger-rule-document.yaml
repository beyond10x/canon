          fields:
            amount: {type: decimal}
        start:
          protocol: send-reminder
        mode: offer
        access: write
        refire: once_per_state_entry
        cap: 50
    expect:
      refused: subject.state.field

  - id: input-is-an-expression
    trigger-validate:
      document: |
        format: canon-trigger/1
        id: stale-invoice-reminder
        version: 3
        owner: billing-operations
        subject:
