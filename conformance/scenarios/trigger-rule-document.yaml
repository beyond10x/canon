          fields:
            id: {type: string}
            status: {type: string}
        start:
          protocol: send-reminder
          input:
            invoice: {expression: '$row.id'}
        mode: offer
        access: write
        refire: once_per_state_entry
        cap: 50
    expect:
      refused: start.input.invoice

  - id: input-names-an-undeclared-field
    trigger-validate:
      document: |
        format: canon-trigger/1
        id: stale-invoice-reminder
        version: 3
        owner: billing-operations
        subject:
          kind: invoice
          state: {field: status, is: overdue}
          fields:
            status: {type: string}
        start:
          protocol: send-reminder
          input:
            invoice: {field: '$row.id'}
        mode: offer
        access: write
        refire: once_per_state_entry
        cap: 50
    expect:
      refused: start.input.invoice

  - id: cap-zero
    trigger-validate:
      document: |
        format: canon-trigger/1
        id: stale-invoice-reminder
        version: 3
        owner: billing-operations
        subject:
          kind: invoice
          state: {field: status, is: overdue}
          fields:
            status: {type: string}
        start:
          protocol: send-reminder
        mode: offer
        access: read_only
        refire: once_per_subject
        cap: 0
    expect:
      refused: cap
