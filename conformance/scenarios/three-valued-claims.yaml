format: canon-conformance/1
id: CANON-CLAIM-001
covers: [CANON-CLAIM-001, CANON-CLAIM-002]
fixture: fixtures/investigation/three-valued-claims.yaml
steps:
  # No evidence of either kind: insufficient to decide, so UNKNOWN, not FALSE.
  - id: no-evidence
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence: []
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "unknown"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # The only falsification attempt refuted the explanation: the evidence contradicts it, so FALSE.
  - id: refuted
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: refuted
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "false"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # Observed, and the only falsification attempt survived: the evidence establishes it, so TRUE.
  - id: survived
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # One falsification attempt survived and one refuted: conflicting evidence neither establishes
  # nor by itself contradicts the predicate, so UNKNOWN.
  - id: conflicting
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
        - format: canon-evidence/1
          id: falsification-2
          kind: falsification_attempt
          result: refuted
          subject: explanation
          subject_revision: r1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "unknown"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }
