format: canon-conformance/1
id: CANON-INVALIDATION-001
covers: [CANON-INVALIDATION-001]
fixture: fixtures/investigation/invalidation-rules.yaml
# The fixture declares two artifacts, explanation and dataset, and one invalidation rule,
# dataset.revised: a change of the dataset's revision invalidates the support of
# explanation.supported, the only claim it names. Exclusion is per claim. observation.recorded
# reads the same kind as the named claim but is neither named nor built on it; explanation.plausible
# is built on the named claim and also reads that kind directly; explanation.survived reads another
# kind. Both records in both evaluate steps are about the explanation at its current revision, so
# the binding stage excludes nothing, and both record that they were observed against dataset
# revision d1. The two evaluate steps differ only in the case snapshot's revision of the dataset.
steps:
  # An invalidation rule is kept in canon-ir/1 under `invalidation`, written only when the
  # protocol declares a rule, so the IR of a protocol without one is unchanged. The claims a rule
  # invalidates are a set: each once, in identifier order.
  - id: compile
    compile: {}
    expect:
      canon-ir: |
        {
          "actions": {},
          "artifacts": {
            "dataset": {
              "description": "The observations the explanation is tested against."
            },
            "explanation": {
              "description": "The explanation under investigation."
            }
          },
          "claims": {
            "explanation.plausible": {
              "description": "The explanation is supported, or an observation is consistent with it.",
              "true_when": {
                "any": [
                  {
                    "claim": {
                      "id": "explanation.supported",
                      "is": "true"
                    }
                  },
                  {
                    "evidence": {
                      "kind": "supporting_observation",
                      "result": null
                    }
                  }
                ]
              }
            },
            "explanation.supported": {
              "description": "The explanation is supported by observation of the dataset.",
              "true_when": {
                "evidence": {
                  "kind": "supporting_observation",
                  "result": null
                }
              }
            },
            "explanation.survived": {
              "description": "The explanation has survived an attempt to falsify it.",
              "true_when": {
                "evidence": {
                  "kind": "falsification_attempt",
                  "result": "survived"
                }
              }
            },
            "observation.recorded": {
              "description": "An observation consistent with the explanation was recorded, whichever dataset revision it was made against.",
              "true_when": {
                "evidence": {
                  "kind": "supporting_observation",
                  "result": null
                }
              }
            }
          },
          "evidence_kinds": {
            "falsification_attempt": {
              "description": "An attempt to refute the explanation; its result is survived or refuted."
            },
            "supporting_observation": {
              "description": "An observation of the dataset consistent with the explanation."
            }
          },
          "format": "canon-ir/1",
          "invalidation": {
            "dataset.revised": {
              "description": "An observation made against an earlier revision of the dataset no longer supports the explanation.",
              "invalidates": [
                "explanation.supported"
              ],
              "upstream": "dataset"
            }
          },
          "obligations": {},
          "outcomes": {},
          "protocol": {
            "description": "Decide whether an explanation is supported by observations of a dataset, and whether it survives an attempt to falsify it.",
            "id": "investigation",
            "revision": 1
          }
        }

  # The dataset is still at d1, the revision both records were observed against: nothing is
  # invalidated, and every claim is TRUE.
  - id: upstream-at-recorded-revision
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
          dataset: {revision: d1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
          upstream_revisions:
            dataset: d1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
          upstream_revisions:
            dataset: d1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.plausible": {
              "value": "true"
            },
            "explanation.supported": {
              "value": "true"
            },
            "explanation.survived": {
              "value": "true"
            },
            "observation.recorded": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # Only the dataset's revision moves, to d2. The observation was made against d1, so
  # dataset.revised invalidates it for the claim it names: explanation.supported no longer reads
  # it, lists it as invalidated, and with no other observation is UNKNOWN, not FALSE. It is
  # excluded from explanation.plausible too, which is built on the named claim: its own evidence
  # match no longer reads the record either, so the `any` is UNKNOWN, not TRUE, and the record is
  # listed. observation.recorded is neither named nor built on a named claim: it keeps the record,
  # stays TRUE and lists nothing, although it reads the same kind. The falsification attempt was
  # observed against d1 too, but no claim it supports is named: explanation.survived stays TRUE.
  - id: upstream-revision-moved
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
          dataset: {revision: d2}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
          upstream_revisions:
            dataset: d1
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
          upstream_revisions:
            dataset: d1
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.plausible": {
              "excluded_evidence": [
                {
                  "evidence": "observation-1",
                  "reason": "invalidated"
                }
              ],
              "value": "unknown"
            },
            "explanation.supported": {
              "excluded_evidence": [
                {
                  "evidence": "observation-1",
                  "reason": "invalidated"
                }
              ],
              "value": "unknown"
            },
            "explanation.survived": {
              "value": "true"
            },
            "observation.recorded": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }
