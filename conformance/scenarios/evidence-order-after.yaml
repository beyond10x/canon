          subject_revision: r1
          observed_at: 2026-10-01T09:00:00Z
        - format: canon-evidence/1
          id: t1
          kind: test_result
          result: failed
          subject: change
          subject_revision: r1
          observed_at: 2026-10-01T09:00:00Z
        - format: canon-evidence/1
          id: t3
          kind: test_result
          result: failed
          subject: change
          subject_revision: r1
          observed_at: 2026-10-01T09:00:01Z
        - format: canon-evidence/1
          id: t2
          kind: test_result
          result: passed
          subject: change
          subject_revision: r2
          observed_at: 2026-10-01T10:00:00Z
    expect:
      decision: |
        {
          "actions": {
            "merge": {
              "status": "admissible"
            }
          },
          "claims": {
            "passes": {
              "excluded_evidence": [
                {
                  "evidence": "t1",
                  "reason": "revision_mismatch"
                },
                {
                  "evidence": "t3",
                  "reason": "revision_mismatch"
                }
              ],
              "value": "true"
            },
            "red.after.change": {
              "value": "true"
            },
            "red.again": {
              "value": "true"
            }
          },
          "outcomes": {
            "done": {
              "status": "legitimate"
            }
          }
        }

  # Expectation 6. The failed run carries no observed_at: its place in the order is not known, so
  # both `after` forms are UNKNOWN, though every other record carries an instant.
  - id: a-failed-run-without-observed-at
