          kind: test_result
          result: failed
          subject: change
          subject_revision: r1
          observed_at: 2026-10-01T09:00:00Z
        - format: canon-evidence/1
          id: t2
          kind: test_result
          result: passed
          subject: change
          subject_revision: r2
          observed_at: 2026-10-01T10:00:00Z
    expect:
