      evidence:
        - format: canon-evidence/1
          id: c1
          kind: tests_change
          subject: change
          subject_revision: r1
          observed_at: 2026-10-01T09:00:00Z
        - format: canon-evidence/1
          id: n1
          kind: test_result
          result: failed
          subject: notes
          subject_revision: n0
          observed_at: 2026-10-01T10:00:00Z
        - format: canon-evidence/1
          id: t2
          kind: test_result
          result: passed
          subject: change
          subject_revision: r2
