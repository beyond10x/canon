              "value": "true"
            },
            "red.after.change": {
              "value": "unknown"
            },
            "red.again": {
              "value": "unknown"
            }
          },
          "outcomes": {
            "done": {
              "reasons": [
                {
                  "claim": "red.after.change",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            }
          }
        }

  # Expectation 6, for a record of the later kind with another result: the passing run carries no
  # observed_at, but `after` over failed runs does not compare it, so red.after.change is TRUE.
  # red.again reads every test_result as its first records, the passing one among them, so it is
  # UNKNOWN: the first test_result is not known.
  - id: a-passing-run-without-observed-at-takes-no-part
    evaluate:
