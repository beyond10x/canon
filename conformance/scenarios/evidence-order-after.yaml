                  "evidence": "t1",
                  "reason": "revision_mismatch"
                }
              ],
              "value": "true"
            },
            "red.after.change": {
              "value": "unknown"
            },
            "red.again": {
              "value": "false"
            }
          },
          "outcomes": {
            "done": {
              "reasons": [
                {
                  "claim": "red.after.change",
                  "value": "unknown"
                }
              ],
              "status": "blocked"
            }
          }
        }

  # Expectation 5, with a second failed run one second after the instant: that one is strictly
  # later, so `after` is TRUE, whatever the run at the instant. red.again is TRUE too: the second
  # failed run came after the first test_result.
  - id: red-at-and-a-second-after-the-instant
    evaluate:
      case:
        format: canon-case/1
        id: TF-1
        protocol: red-after-change
        artifacts:
