          "actions": {
            "merge": {
              "reasons": [
                {
                  "after": "tests_change",
                  "result": "failed",
                  "subject": "change",
                  "then": "test_result",
                  "value": "false"
                }
              ],
              "status": "blocked"
            }
          },
          "claims": {
            "passes": {
              "value": "true"
            },
            "red.after.change": {
              "value": "false"
            },
            "red.again": {
              "value": "false"
            }
          },
          "outcomes": {
            "done": {
              "reasons": [
                {
                  "claim": "red.after.change",
                  "value": "false"
                }
              ],
              "status": "blocked"
            }
          }
        }

  # Expectation 5. The failed run shares the instant of the first tests_change. One second's
  # resolution cannot order them, so `after` is UNKNOWN, not TRUE: an `after` that took an equal
  # instant as later would make the action admissible here. red.again is FALSE: the failed run is
  # the first test_result.
  - id: red-at-the-instant-of-the-tests-change
    evaluate:
