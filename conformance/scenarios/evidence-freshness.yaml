format: canon-conformance/1
id: CANON-EVIDENCE-002
covers: [CANON-EVIDENCE-002]
fixture: fixtures/investigation/evidence-freshness.yaml
# The fixture gives supporting_observation a maximum age of 1h; falsification_attempt has none.
# Both steps evaluate the same case and the same evidence, observed at 12:00; only the evaluation
# instant differs.
steps:
  # 30 minutes after the observation: within its maximum age, so it applies, and with the
  # surviving falsification attempt it establishes the claim: TRUE.
  - id: within-max-age
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
          observed_at: 2026-10-04T12:00:00Z
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
          observed_at: 2026-10-04T12:00:00Z
      at: 2026-10-04T12:30:00Z
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "value": "true"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }

  # Two hours after the observation: past its maximum age, so it is excluded as expired. The
  # falsification attempt, whose kind declares no maximum age, still applies. Without an
  # applicable observation the claim is UNKNOWN: expiry alone never makes it FALSE.
  - id: past-max-age
    evaluate:
      case:
        format: canon-case/1
        id: INV-18
        protocol: investigation
        artifacts:
          explanation: {revision: r1}
      evidence:
        - format: canon-evidence/1
          id: observation-1
          kind: supporting_observation
          subject: explanation
          subject_revision: r1
          observed_at: 2026-10-04T12:00:00Z
        - format: canon-evidence/1
          id: falsification-1
          kind: falsification_attempt
          result: survived
          subject: explanation
          subject_revision: r1
          observed_at: 2026-10-04T12:00:00Z
      at: 2026-10-04T14:00:00Z
    expect:
      decision: |
        {
          "case": "INV-18",
          "claims": {
            "explanation.supported": {
              "excluded_evidence": [
                {
                  "evidence": "observation-1",
                  "reason": "expired"
                }
              ],
              "value": "unknown"
            }
          },
          "format": "canon-decision/1",
          "protocol": "investigation",
          "protocol_revision": 1
        }
