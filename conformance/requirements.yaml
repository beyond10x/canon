format: canon-requirements/1
# The normative requirements Canon implements (Atlas ADR 0067): each `implemented` one is covered by
# at least one passing scenario of the registry conformance/scenarios/, which
# `canon conform run --requirements conformance/requirements.yaml` checks. A statement comes from
# docs/design/canon-protocol-calculus-design.md § 32 where it states the requirement, else from the
# story that introduced its scenario, named in `source`. A requirement stated but not yet
# implemented is `planned`; none is listed today.
requirements:
  CANON-CLAIM-001:
    status: implemented
    statement: A required positive predicate evaluating to UNKNOWN MUST NOT be treated as satisfied.
    source: design § 32
  CANON-CLAIM-002:
    status: implemented
    statement: A required positive predicate evaluating to FALSE MUST NOT be treated as satisfied.
    source: design § 32
  CANON-EVIDENCE-001:
    status: implemented
    statement: >-
      Evidence bound to a subject revision MUST NOT establish a current-revision claim after the
      subject revision changes.
    source: design § 32
  CANON-EVIDENCE-002:
    status: implemented
    statement: >-
      Expired evidence MUST become inapplicable or UNKNOWN; expiration alone MUST NOT imply FALSE.
    source: design § 32
  CANON-EVIDENCE-003:
    status: implemented
    statement: >-
      An evidence match that names the artifact its record must be about MUST NOT be satisfied by a
      record about another artifact.
    source: story:subject-bound-evidence-match
  CANON-AUTHORITY-001:
    status: implemented
    statement: >-
      An action or transition with an unsatisfied authority requirement MUST NOT be treated as
      admissible.
    source: design § 32
  CANON-INDEPENDENCE-001:
    status: implemented
    statement: >-
      Evidence failing a declared independence relation MUST NOT satisfy a requirement that demands
      such independence.
    source: design § 32
  CANON-OUTCOME-001:
    status: implemented
    statement: A Case MUST terminate only through an outcome declared by its governing protocol.
    source: design § 32
  CANON-OUTCOME-002:
    status: implemented
    statement: >-
      An outcome that requires an explicit decision MUST be legitimate only with a decision of that
      name, for that outcome, taken at the case snapshot's current revision.
    source: story:decision-outcomes
  CANON-INVALIDATION-001:
    status: implemented
    statement: >-
      Changing a bound upstream artifact MUST invalidate dependent claims whose only support was
      bound to the previous revision.
    source: design § 32
  CANON-DETERMINISM-001:
    status: implemented
    statement: >-
      Equivalent normalized protocol, case, evidence, authority, and evaluation-time inputs MUST
      produce equivalent normalized evaluation outputs.
    source: design § 32
  CANON-EXPLAIN-001:
    status: implemented
    statement: >-
      Every non-TRUE claim, open obligation, non-admissible action and blocked outcome MUST carry a
      structured explanation down to the evidence records that applied or were excluded, each
      exclusion with its reason.
    source: story:explanation
  CANON-OBLIGATION-001:
    status: implemented
    statement: An obligation whose discharge predicate is not TRUE MUST be open.
    source: story:obligations
  CANON-INPUT-001:
    status: implemented
    statement: >-
      An obligation whose applicability predicate over case inputs and claims is FALSE MUST NOT hold
      back an outcome; one whose applicability is UNKNOWN MUST stay open.
    source: story:case-inputs
  CANON-ORDER-001:
    status: implemented
    statement: >-
      A predicate over evidence order MUST read the history of records, including those bound to a
      superseded revision, and MUST be UNKNOWN while the order is not established.
    source: story:evidence-order-predicate
  CANON-ORDER-002:
    status: implemented
    statement: >-
      A predicate over a record observed after the first record of a kind MUST read the history of
      records, MUST NOT take a record observed at the same instant as later, and MUST be UNKNOWN
      while the first record or the order of a record it compares is not established.
    source: story:evidence-order-after
  CANON-ORDER-003:
    status: implemented
    statement: >-
      An observed_at with a fraction of one to nine digits MUST be read, and any other fraction MUST
      be refused as invalid-instant. The order forms MUST compare every instant of an evaluation at
      one resolution, the coarsest written among the records with an observed_at, each read by
      dropping the finer digits; records whose instants differ there MUST be ordered as they
      differ, and records whose instants are equal there MUST NOT be ordered.
    source: story:evidence-order-subsecond
  CANON-ORDER-004:
    status: implemented
    statement: >-
      A predicate over a record observed since the latest record of a kind MUST read the history of
      records, MUST count only records at the subject and subject revision of a latest record, MUST
      NOT take a record observed at an overlapping instant as later, and MUST be UNKNOWN while the
      latest record or the order of a record it compares is not established.
    source: story:evidence-order-since
  CANON-COMPOSE-001:
    status: implemented
    statement: >-
      An action MAY declare a child case it opens, by protocol and subject. A predicate over the
      outcomes of the child cases MUST be FALSE once a child case ended with an outcome it does not
      list, otherwise MUST be UNKNOWN while a child case is open or when no child case is recorded,
      and MUST be TRUE only when every child case ended with an outcome it lists. Two outcome
      records for one child case MUST be refused.
    source: story:case-composition
  CANON-IMPORT-001:
    status: implemented
    statement: >-
      A protocol MAY import other protocols, each pinned to its revision and to the digest of its
      compiled IR. Compiling it with exactly the documents it imports, directly or through another
      import, MUST give one closed IR that names the importing protocol only, holds every imported
      declaration once and no import, and does not depend on the order the documents are given in.
      An import without a document, a document no import names, a revision or digest other than the
      pin, an import cycle, a redeclaration not listed under refines and two imports that declare
      one identifier differently MUST be refused.
    source: story:protocol-imports
  CANON-SCOPE-001:
    status: implemented
    statement: >-
      A capability requirement no authority decision covers MUST NOT be treated as granted. A
      decision MUST cover a requirement of its capability only when the requirement gives every
      scope key the decision gives a value for that same value, and MUST cover every value of a key
      it gives no value for. Among the decisions covering a requirement, a denial MUST win over
      require_approval and require_approval over a grant; a denied requirement MUST block the
      action, naming the denied capability, and one requiring approval MUST make it
      approval-required.
    source: story:capability-scope
  CANON-AUTHORITY-002:
    status: implemented
    statement: >-
      An authority decision bound to a case revision MUST apply, whatever its decision, only while
      the case snapshot's revision equals it, and MUST NOT apply when the snapshot has no revision;
      one bound to no case revision MUST apply at every case revision. A decision that does not
      apply MUST take no part in coverage or precedence. The principal a decision names MUST NOT
      change admissibility. Two decisions equal in capability, scope, case revision and principal
      MUST be refused.
    source: story:authority-revision-binding
  CANON-SUPPLY-001:
    status: implemented
    statement: >-
      An evidence kind MAY name, as supplied_by, another protocol whose cases produce its records,
      and its compiled canon-ir/1 entry MUST carry that name. A record of such a kind MAY name
      upstream artifacts the protocol does not declare, and MUST then be evaluated to the decision
      the same record without those entries gives. The same record under a kind without
      supplied_by MUST be refused as undeclared-artifact.
    source: story:supplied-evidence
