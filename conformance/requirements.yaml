format: canon-requirements/1
# The normative requirements Canon implements (Atlas ADR 0067): each `implemented` one is covered by
# at least one passing scenario of the registry conformance/scenarios/, which
# `canon conform run --requirements conformance/requirements.yaml` checks. A statement comes from
# docs/design/canon-protocol-calculus-design.md § 32 where it states the requirement, else from the
# story that introduced its scenario, named in `source`. A requirement stated but not yet
# implemented is `planned`; none is listed today.
requirements:
  CANON-CLAIM-001:
    status: implemented
    statement: A required positive predicate evaluating to UNKNOWN MUST NOT be treated as satisfied.
    source: design § 32
  CANON-CLAIM-002:
    status: implemented
    statement: A required positive predicate evaluating to FALSE MUST NOT be treated as satisfied.
    source: design § 32
  CANON-EVIDENCE-001:
    status: implemented
    statement: >-
      Evidence bound to a subject revision MUST NOT establish a current-revision claim after the
      subject revision changes.
    source: design § 32
  CANON-EVIDENCE-002:
    status: implemented
    statement: >-
      Expired evidence MUST become inapplicable or UNKNOWN; expiration alone MUST NOT imply FALSE.
    source: design § 32
  CANON-EVIDENCE-003:
    status: implemented
    statement: >-
      An evidence match that names the artifact its record must be about MUST NOT be satisfied by a
      record about another artifact.
    source: story:subject-bound-evidence-match
  CANON-AUTHORITY-001:
    status: implemented
    statement: >-
      An action or transition with an unsatisfied authority requirement MUST NOT be treated as
      admissible.
    source: design § 32
  CANON-INDEPENDENCE-001:
    status: implemented
    statement: >-
      Evidence failing a declared independence relation MUST NOT satisfy a requirement that demands
      such independence.
    source: design § 32
  CANON-OUTCOME-001:
    status: implemented
    statement: A Case MUST terminate only through an outcome declared by its governing protocol.
    source: design § 32
  CANON-OUTCOME-002:
    status: implemented
    statement: >-
      An outcome that requires an explicit decision MUST be legitimate only with a decision of that
      name, for that outcome, taken at the case snapshot's current revision.
    source: story:decision-outcomes
  CANON-OUTCOME-003:
    status: implemented
    statement: >-
      An outcome that requires an explicit decision with a condition MUST count the decision only
      while the condition is TRUE at the evaluation, whenever the decision was taken; while it is
      FALSE or UNKNOWN the outcome MUST be blocked by the condition's reasons, and the decision
      MUST be neither counted nor refused.
    source: story:decision-condition
  CANON-INVALIDATION-001:
    status: implemented
    statement: >-
      Changing a bound upstream artifact MUST invalidate dependent claims whose only support was
      bound to the previous revision.
    source: design § 32
  CANON-DETERMINISM-001:
    status: implemented
    statement: >-
      Equivalent normalized protocol, case, evidence, authority, and evaluation-time inputs MUST
      produce equivalent normalized evaluation outputs.
    source: design § 32
  CANON-EXPLAIN-001:
    status: implemented
    statement: >-
      Every non-TRUE claim, open obligation, non-admissible action and blocked outcome MUST carry a
      structured explanation down to the evidence records that applied or were excluded, each
      exclusion with its reason.
    source: story:explanation
  CANON-OBLIGATION-001:
    status: implemented
    statement: An obligation whose discharge predicate is not TRUE MUST be open.
    source: story:obligations
  CANON-INPUT-001:
    status: implemented
    statement: >-
      An obligation whose applicability predicate over case inputs and claims is FALSE MUST NOT hold
      back an outcome; one whose applicability is UNKNOWN MUST stay open.
    source: story:case-inputs
  CANON-ORDER-001:
    status: implemented
    statement: >-
      A predicate over evidence order MUST read the history of records, including those bound to a
      superseded revision, and MUST be UNKNOWN while the order is not established.
    source: story:evidence-order-predicate
  CANON-ORDER-002:
    status: implemented
    statement: >-
      A predicate over a record observed after the first record of a kind MUST read the history of
      records, MUST NOT take a record observed at the same instant as later, and MUST be UNKNOWN
      while the first record or the order of a record it compares is not established.
    source: story:evidence-order-after
  CANON-ORDER-003:
    status: implemented
    statement: >-
      An observed_at with a fraction of one to nine digits MUST be read, and any other fraction MUST
      be refused as invalid-instant. The order forms MUST compare every instant of an evaluation at
      one resolution, the coarsest written among the records with an observed_at, each read by
      dropping the finer digits; records whose instants differ there MUST be ordered as they
      differ, and records whose instants are equal there MUST NOT be ordered.
    source: story:evidence-order-subsecond
  CANON-ORDER-004:
    status: implemented
    statement: >-
      A predicate over a record observed since the latest record of a kind MUST read the history of
      records, MUST count only records at the subject and subject revision of a latest record, MUST
      NOT take a record observed at an overlapping instant as later, and MUST be UNKNOWN while the
      latest record or the order of a record it compares is not established.
    source: story:evidence-order-since
  CANON-ORDER-005:
    status: implemented
    statement: >-
      A predicate over an item that had one result on an earlier revision and another on the
      current revision MUST read the history of records, MUST pair only records that name the same
      item, MUST count an earlier record only on a revision the case snapshot lists as one the
      current revision of its subject descends from, MUST be FALSE when a later record has no such
      pair, and MUST be UNKNOWN when there is no later record or the snapshot does not give the
      descent of its subject.
    source: story:revision-ordering
  CANON-COMPOSE-001:
    status: implemented
    statement: >-
      An action MAY declare a child case it opens, by protocol and subject. A predicate over the
      outcomes of the child cases MUST be FALSE once a child case ended with an outcome it does not
      list, otherwise MUST be UNKNOWN while a child case is open or when no child case is recorded,
      and MUST be TRUE only when every child case ended with an outcome it lists. Two outcome
      records for one child case MUST be refused.
    source: story:case-composition
  CANON-IMPORT-001:
    status: implemented
    statement: >-
      A protocol MAY import other protocols, each pinned to its revision and to the digest of its
      compiled IR. Compiling it with exactly the documents it imports, directly or through another
      import, MUST give one closed IR that names the importing protocol only, holds every imported
      declaration once and no import, and does not depend on the order the documents are given in.
      An import without a document, a document no import names, a revision or digest other than the
      pin, an import cycle, a redeclaration not listed under refines and two imports that declare
      one identifier differently MUST be refused.
    source: story:protocol-imports
  CANON-SCOPE-001:
    status: implemented
    statement: >-
      A capability requirement no authority decision covers MUST NOT be treated as granted. A
      decision MUST cover a requirement of its capability only when the requirement gives every
      scope key the decision gives a value for that same value, and MUST cover every value of a key
      it gives no value for. Among the decisions covering a requirement, a denial MUST win over
      require_approval and require_approval over a grant; a denied requirement MUST block the
      action, naming the denied capability, and one requiring approval MUST make it
      approval-required.
    source: story:capability-scope
  CANON-AUTHORITY-002:
    status: implemented
    statement: >-
      An authority decision bound to a case revision MUST apply, whatever its decision, only while
      the case snapshot's revision equals it, and MUST NOT apply when the snapshot has no revision;
      one bound to no case revision MUST apply at every case revision. A decision that does not
      apply MUST take no part in coverage or precedence. The principal a decision names MUST NOT
      change admissibility. Two decisions equal in capability, scope, case revision and principal
      MUST be refused.
    source: story:authority-revision-binding
  CANON-SUPPLY-001:
    status: implemented
    statement: >-
      An evidence kind MAY name, as supplied_by, another protocol whose cases produce its records,
      and its compiled canon-ir/1 entry MUST carry that name. A record of such a kind MAY name
      upstream artifacts the protocol does not declare, and MUST then be evaluated to the decision
      the same record without those entries gives. The same record under a kind without
      supplied_by MUST be refused as undeclared-artifact.
    source: story:supplied-evidence
  CANON-COMPOSE-002:
    status: implemented
    statement: >-
      A predicate over the outcomes of the child cases MAY be bound to the current revision. Bound,
      it MUST read only the outcome records whose subject revision is the case snapshot's current
      revision of their subject, MUST NOT treat a record about another revision as contradicting
      it, and MUST be UNKNOWN when it reads no record; over the records it reads it MUST follow
      CANON-COMPOSE-001. Unbound, it MUST read every outcome record, and its compiled form MUST
      be the form it had before the binding existed.
    source: story:child-outcome-revision
  CANON-FRONTIER-001:
    status: implemented
    statement: >-
      The decision MUST map each admissible action whose may_produce is not empty to the evidence
      kinds of that list that have no applicable record, in kind-identifier order, and MUST NOT
      list an action that is blocked, one that is approval-required or one whose may_produce is
      empty. A record MUST be applicable when the revision-binding and freshness stages leave it and
      no claim lists it in excluded_evidence, and MUST NOT depend on its result or on whether its
      kind declares supplied_by. The section MUST NOT change any other section.
    source: story:missing-evidence
  CANON-PENDING-001:
    status: implemented
    statement: >-
      The decision MUST list under pending_decisions.authority one entry per requirement an
      approval-required action names as not decided or as require_approval, giving the action, the
      capability, the scope when the requirement has one, that decision as current, the case
      snapshot's revision as case_revision when the snapshot has one, and the options granted and
      denied. It MUST NOT list a requirement that is granted, nor any requirement of a blocked
      action, whether its precondition is not true or a requirement of it is denied. A requirement
      covered only by authority decisions bound to another case revision MUST be listed as not
      decided. The entries MUST be ordered by action, then capability, then scope: no scope first,
      and two scopes by their key-value pairs in key order, compared pair by pair, key before
      value, a scope that is a prefix of the other first. The decision MUST list under
      pending_decisions.decisions, in outcome order, one entry per outcome blocked because no
      explicit decision applies, giving the outcome, the decision, the case revision and the option
      taken; for a snapshot without a revision it MUST give neither a case revision nor an option.
      An explicit decision taken at the snapshot's revision MUST remove its outcome's entry, and
      one taken at another revision MUST NOT. A list with no entry MUST be left out. The section
      MUST NOT change any other section.
    source: story:pending-decisions
  CANON-EVIDENCE-004:
    status: implemented
    statement: >-
      An evidence record given more than once in one evaluation MUST count once when every copy
      equals the first in its kind, result, subject, subject revision, observed_at as written,
      producer, child case and upstream revisions, the upstream revisions in any order. The
      decision MUST then be byte-identical to the one without the copy, explanation included,
      wherever the copy stands in the list, and an equal copy of a case_outcome record MUST NOT be
      refused. A copy that differs in any of them MUST be refused as duplicate-identifier;
      observed_at MUST be compared as written text, so that 12:00:00Z and 12:00:00.000Z differ.
    source: story:evidence-redelivery
  CANON-GROUND-001:
    status: implemented
    statement: >-
      An entry of canon-authority/1 or canon-decisions/1 MAY name grounds: ground_revisions,
      artifact revisions keyed by artifact, and ground_evidence, evidence record ids. An artifact
      ground MUST hold exactly when its revision equals the case snapshot's current revision of the
      artifact, and an evidence ground exactly when a record with its id is applicable in the sense
      of CANON-FRONTIER-001; an id no given record has MUST NOT be refused. An entry MUST take part
      in coverage, precedence and decided_by only when every ground holds and its case revision,
      when it has one, is current, whatever it decided. A requirement covered only by entries that
      do not apply MUST be approval-required with the reason decision none, and an outcome whose
      only explicit decision does not apply MUST be blocked with the reason present false; either
      reason MUST then list under stale_grounds each failed ground of the entries that every other
      rule would let apply, set aside by their grounds alone, once, artifact grounds by artifact
      and then revision, as revision_mismatch with the ground's revision, then evidence grounds by
      id, with the reason the record was excluded with, or present false when no record has the
      id. An entry set aside by its case revision MUST NOT add a ground, whether its grounds hold
      or not, since it would not apply whatever they do. pending_decisions MUST list such a
      requirement and such an outcome as it lists one with no decision. The order of the entries in
      a document MUST NOT change the result. A ground artifact the protocol does not declare MUST
      be refused as undeclared-artifact, and a ground artifact, revision or evidence id that is not
      an identifier as invalid-identifier. Two entries that differ only in their grounds MUST be
      refused as duplicate-identifier.
    source: story:decision-grounds
  CANON-GROUND-002:
    status: implemented
    statement: >-
      A ground_evidence entry of canon-authority/1 or canon-decisions/1 MAY be written as a map
      with the evidence id and an optional digest, sha256: followed by 64 lowercase hexadecimal
      digits of the SHA-256 of the record's canonical form (RFC 8785 of its fields as read). A map
      without a digest MUST hold exactly as the bare id does. A ground with a digest MUST fail as
      content_changed when the record given under its id has another digest, whether or not that
      record is applicable, and the entry MUST then not apply; it MUST hold as a bare id does when
      the digest is the record's. The key order and whitespace of the record MUST NOT change its
      digest. With no record under the id it MUST fail with present false. A digest of another form,
      and a map with another key or without an id, MUST be refused as malformed-input. Inputs without
      the map form MUST give the decision they gave before it existed.
    source: story:evidence-digest-binds-approvals
  CANON-COMPOSE-003:
    status: implemented
    statement: >-
      A predicate over the outcomes of the child cases MAY name an artifact as its subject. Naming
      one, it MUST read only the outcome records whose subject is that artifact, and, bound to the
      current revision too, only those among them whose subject revision is the case snapshot's
      current revision of it; a record about another artifact MUST NOT establish or contradict it.
      Over the records it reads it MUST follow CANON-COMPOSE-001, counting only the records it is
      given. Without a subject it MUST read the records about every artifact, and its compiled
      form MUST be the form it had before the subject existed. A blocked action MUST name the
      predicate in its reasons with its subject, and two predicates that differ only in their
      subject MUST be two reasons, the one without a subject first.
    source: story:child-outcome-subject
  CANON-COMPOSE-004:
    status: implemented
    statement: >-
      A predicate over the outcomes of the child cases MAY name a count, an integer of 1 or more.
      With a count, over the records it reads, it MUST be FALSE once a record names an outcome it
      does not list and that is not open, otherwise MUST be UNKNOWN while a child case is open or
      while it reads fewer records than the count, and MUST be TRUE only when it reads at least
      that many records, each with an outcome it lists; a child case with no record MUST NOT make
      it TRUE. A count of 0 MUST be refused. Without a count it MUST follow CANON-COMPOSE-001, and
      its compiled form MUST be the form it had before the count existed. A blocked action MUST
      name the predicate in its reasons with its count.
    source: story:children-form-counts-unopened-children
  CANON-TRIGGER-001:
    status: implemented
    statement: >-
      A canon-trigger/1 document MUST be refused, naming the field, when a required field is
      missing, a field is not part of the format, a value is outside what the format allows (a
      mode other than offer or auto, an access other than read_only or write, a version or cap
      that is not a positive integer), or its state field is not a declared row field; a document
      with every field valid MUST be accepted with its rule key `<id>@<version>`.
    source: story:trigger-rule-document
  CANON-TRIGGER-002:
    status: implemented
    statement: >-
      A trigger rule's where MUST compile with canon-expr/1 against a catalog holding only the Pure
      builtins contains and present_<type> of its optional declared fields' types, with $row the
      record of its declared fields as the one context variable; a where that calls any other
      function, reads a field the rule does not declare, or is not Bool MUST be refused naming
      where.
    source: story:trigger-rule-document
  CANON-TRIGGER-003:
    status: implemented
    statement: >-
      A start.input value MUST be a declared row field or a constant string; an expression, or a
      field the rule does not declare, MUST be refused naming start.input.<name>.
    source: story:trigger-rule-document
  CANON-TRIGGER-004:
    status: implemented
    statement: >-
      An action MAY declare access read_only or write; an action without it MUST be write. A
      protocol's access class MUST be read_only when every action is read_only and write
      otherwise, and canon-ir/1 MUST carry it with whether the protocol is guarded; a protocol
      that declares no access MUST compile to the canon-ir/1 it compiled to before access
      existed, apart from those two keys.
    source: story:protocol-access-class
  CANON-TRIGGER-005:
    status: implemented
    statement: >-
      An action that declares access read_only and revises an artifact or opens a case MUST be
      refused as read-only-action-writes.
    source: story:protocol-access-class
  CANON-TRIGGER-006:
    status: implemented
    statement: >-
      A protocol MUST be guarded when one of its actions requires a capability, and not guarded
      otherwise. canon trigger protocols MUST print, for each protocol of its set, keyed by
      protocol id, its access class, whether it is guarded and the case inputs it declares with
      their values; a set with two documents of one protocol id MUST be refused.
    source: story:protocol-access-class
  CANON-TRIGGER-007:
    status: implemented
    statement: >-
      A row MUST match a trigger rule when its kind is the rule's subject.kind, its state field
      equals is and its where is true, and a row that does not match MUST NOT be listed. canon
      trigger evaluate MUST list each match once with the rule key, the rule's state, the kind,
      the row id, the protocol, the input built from start.input and the firing id, with the
      verdict offer for a rule in mode offer and would-start for one in mode auto; a draft rule
      MUST be evaluated alike, its entries marked rule_state draft.
    source: story:trigger-evaluate
  CANON-TRIGGER-008:
    status: implemented
    statement: >-
      The canon-trigger-plan/1 plan MUST be ordered by rule key, kind and row id, and MUST be
      byte-identical over repeated evaluations of one input and whatever the order of its rules,
      kinds, rows, firings, activations and approvals.
    source: story:trigger-evaluate
  CANON-TRIGGER-009:
    status: implemented
    statement: >-
      A match's firing id MUST be `<rule key>/<kind>:<row id>/<entered_at>` under
      once_per_state_entry, so a row that enters its state again gets a new one, and
      `<rule key>/<kind>:<row id>` under once_per_subject; a row without entered_at under
      once_per_state_entry MUST be listed refused with the reason entered-at-missing.
    source: story:trigger-evaluate
  CANON-TRIGGER-010:
    status: implemented
    statement: >-
      A match MUST be listed baseline, never offer or would-start, when an activation of its rule
      key in the history is at or after the row's entered_at, or lists the row as
      `<kind>:<row id>`.
    source: story:trigger-evaluate
  CANON-TRIGGER-011:
    status: implemented
    statement: >-
      A row of the rule's kind that lacks a declared required field, or holds a value of another
      type than its declaration, MUST be listed undetermined with the reason field-missing or
      field-type naming the field, without evaluating where, when the row is in the rule's state
      or its state field is that field; a where that does not evaluate to true or false MUST be
      listed undetermined with the reason where-unknown. Unknown is not false.
    source: story:trigger-evaluate
  CANON-TRIGGER-012:
    status: implemented
    statement: >-
      An entry MUST be listed refused, ahead of every other verdict, naming the first reason that
      applies: disabled when the rule's state is disabled; unknown-protocol when its protocol is
      not in the protocols; guarded-auto when the protocol is guarded and the rule's mode is auto;
      access-mismatch when the rule's access differs from the protocol's class; write-unapproved
      when the rule's access is write, its mode auto and the history holds no approval of its
      rule key; entered-at-missing.
    source: story:trigger-holds-and-refusals
  CANON-TRIGGER-013:
    status: implemented
    statement: >-
      An approval MUST count only for the exact rule key it names: an approval of another version
      of the rule MUST NOT lift write-unapproved. Who approved MUST NOT be checked.
    source: story:trigger-holds-and-refusals
  CANON-TRIGGER-014:
    status: implemented
    statement: >-
      A match whose firing id is the firing id of a firing in the history MUST be listed held with
      the reason already-fired, never offer or would-start, so evaluating again with the plan's
      firings recorded starts nothing twice.
    source: story:trigger-holds-and-refusals
  CANON-TRIGGER-015:
    status: implemented
    statement: >-
      A match MUST be listed held with the reason cap-reached when its rule key's firings on the
      UTC day of the evaluation instant, counted from the history and then from the plan's earlier
      would-start entries of that rule key in plan order, have reached the rule's cap.
    source: story:trigger-holds-and-refusals
