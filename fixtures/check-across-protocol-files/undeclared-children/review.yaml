format: protocol/1

protocol:
  id: review
  revision: 1
  description: Seeded defect, a review whose children form lists the outcome lost, which the protocol change it opens about the work never declares.

artifacts:
  work:
    description: The work under review; a child change case is opened about it.

evidence_kinds:
  case_outcome:
    description: The outcome of one child case, one record per child; open while the child runs.

claims:
  work.ended:
    description: Every child case about the work ended accepted or lost.
    true_when:
      children: {in: [accepted, lost], subject: work}

actions:
  change.open:
    description: Open a child change case about the work.
    case_open: {protocol: change, subject: work}

outcomes:
  reviewed:
    requires: {claim: work.ended}
