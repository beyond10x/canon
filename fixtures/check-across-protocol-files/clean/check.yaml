format: protocol/1

protocol:
  id: check
  revision: 1
  description: A check of review notes, which ends passed or failed.

artifacts:
  notes:
    description: The notes checked.

evidence_kinds:
  result:
    description: The result of the check; passed or failed.

claims:
  check.passed:
    true_when:
      evidence: {kind: result, subject: notes, result: passed}
  check.failed:
    true_when:
      evidence: {kind: result, subject: notes, result: failed}

actions:
  run:
    description: Run the check.
    may_produce:
      - evidence: result

outcomes:
  passed:
    requires: {claim: check.passed}
  failed:
    requires: {claim: check.failed}
