format: protocol/1

protocol:
  id: change
  revision: 1
  description: A change to a piece of work, which ends accepted or declined.

artifacts:
  work:
    description: The work changed.

evidence_kinds:
  verdict:
    description: The verdict on the change; its result is accepted or declined.

claims:
  change.accepted:
    true_when:
      evidence: {kind: verdict, subject: work, result: accepted}
  change.declined:
    true_when:
      evidence: {kind: verdict, subject: work, result: declined}

actions:
  decide:
    description: Decide the change.
    may_produce:
      - evidence: verdict

outcomes:
  accepted:
    requires: {claim: change.accepted}
  declined:
    requires: {claim: change.declined}
