format: protocol/1

protocol:
  id: review
  revision: 1
  description: A review that opens a child case under the protocol change about the work and names its outcome accepted, which change.yaml declares and change-other.yaml, a second protocol with the id change, does not.

artifacts:
  work:
    description: The work under review; a child change case is opened about it.

evidence_kinds:
  case_outcome:
    description: The outcome of one child case, one record per child; open while the child runs.

claims:
  work.accepted:
    true_when:
      evidence: {kind: case_outcome, subject: work, result: accepted}

actions:
  change.open:
    description: Open a child change case about the work.
    case_open: {protocol: change, subject: work}

outcomes:
  reviewed:
    requires: {claim: work.accepted}
