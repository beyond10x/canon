format: protocol/1

protocol:
  id: review
  revision: 1
  description: Seeded defect, a review that reads the outcome failed of its child about the work; only the protocol check, which it opens about the notes, declares failed.

artifacts:
  work:
    description: The work under review; a child change case is opened about it.
  notes:
    description: The review notes; a child check case is opened about them.

evidence_kinds:
  case_outcome:
    description: The outcome of one child case, one record per child; open while the child runs.

claims:
  work.accepted:
    true_when:
      evidence: {kind: case_outcome, subject: work, result: accepted}
  work.failed:
    true_when:
      evidence: {kind: case_outcome, subject: work, result: failed}
  notes.passed:
    true_when:
      evidence: {kind: case_outcome, subject: notes, result: passed}

actions:
  change.open:
    description: Open a child change case about the work.
    case_open: {protocol: change, subject: work}
  check.open:
    description: Open a child check case about the notes.
    case_open: {protocol: check, subject: notes}

outcomes:
  reviewed:
    requires:
      all:
        - claim: work.accepted
        - claim: notes.passed
  abandoned:
    requires: {claim: work.failed}
