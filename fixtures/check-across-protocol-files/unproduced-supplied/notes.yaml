format: protocol/1

protocol:
  id: notes.write
  revision: 1
  description: Seeded defect, the supplier of the review's peer_note, which declares the kind but has no action that may produce it.

artifacts:
  notes:
    description: The notes written.

evidence_kinds:
  peer_note:
    description: The note written; no action here may produce it.
  draft_note:
    description: A draft of the note.

claims:
  note.drafted:
    true_when:
      evidence: {kind: draft_note, subject: notes}
  note.written:
    true_when:
      evidence: {kind: peer_note, subject: notes}

actions:
  draft:
    description: Draft the note.
    may_produce:
      - evidence: draft_note

outcomes:
  drafted:
    requires: {claim: note.drafted}
