format: protocol/1
protocol:
  id: probe.pair
  revision: 1
  description: a group that names one kind twice, so fewer than two distinct kinds
artifacts:
  doc:
    description: the document checked
evidence_kinds:
  shape:
    description: shape check
  fit:
    description: fit check
claims:
  shaped:
    description: a shape record exists
    true_when:
      evidence:
        kind: shape
        subject: doc
outcomes:
  done:
    description: shape checked
    requires:
      claim: shaped
actions:
  check:
    description: records both kinds
    may_produce:
      - evidence: shape
      - evidence: fit
    records_together:
      - kinds: [shape, shape]
