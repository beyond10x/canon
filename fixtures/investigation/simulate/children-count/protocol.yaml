format: protocol/1

protocol:
  id: simulate.children-count
  revision: 1
  description: >-
    Five readers opened in any order about one subject, each once, then a merge once all five
    ended complete. One claim with `count: 5` waits for the five, the ones not yet opened too. The
    probes are legitimate only where that claim is true while a reader is unopened, or where the
    merge found nothing while a reader is not complete, which no real case reaches.

artifacts:
  sources:
    description: What the five readers read.
  merged:
    description: What the merge writes.

evidence_kinds:
  case_outcome:
    description: The outcome of one child case, `open` while it runs.
  a_opened:
    description: Reader a was opened.
  b_opened:
    description: Reader b was opened.
  c_opened:
    description: Reader c was opened.
  d_opened:
    description: Reader d was opened.
  e_opened:
    description: Reader e was opened.
  merge_opened:
    description: The merge was opened.

claims:
  a.opened:
    description: Reader a was opened.
    true_when: {evidence: {kind: a_opened}}
  b.opened:
    description: Reader b was opened.
    true_when: {evidence: {kind: b_opened}}
  c.opened:
    description: Reader c was opened.
    true_when: {evidence: {kind: c_opened}}
  d.opened:
    description: Reader d was opened.
    true_when: {evidence: {kind: d_opened}}
  e.opened:
    description: Reader e was opened.
    true_when: {evidence: {kind: e_opened}}
  merge.opened:
    description: The merge was opened.
    true_when: {evidence: {kind: merge_opened}}
  readers.ended:
    description: Five readers ended, each complete or partial.
    true_when: {children: {in: [complete, partial], subject: sources, count: 5}}
  readers.complete:
    description: Five readers ended, each complete.
    true_when: {children: {in: [complete], subject: sources, count: 5}}
  merged.none:
    description: The merge found nothing.
    true_when: {evidence: {kind: case_outcome, subject: merged, result: none}}

actions:
  a.open:
    description: Open reader a, once.
    precondition: {claim: a.opened, is: unknown}
    case_open: {protocol: reader, subject: sources}
    may_produce:
      - evidence: a_opened
  b.open:
    description: Open reader b, once.
    precondition: {claim: b.opened, is: unknown}
    case_open: {protocol: reader, subject: sources}
    may_produce:
      - evidence: b_opened
  c.open:
    description: Open reader c, once.
    precondition: {claim: c.opened, is: unknown}
    case_open: {protocol: reader, subject: sources}
    may_produce:
      - evidence: c_opened
  d.open:
    description: Open reader d, once.
    precondition: {claim: d.opened, is: unknown}
    case_open: {protocol: reader, subject: sources}
    may_produce:
      - evidence: d_opened
  e.open:
    description: Open reader e, once.
    precondition: {claim: e.opened, is: unknown}
    case_open: {protocol: reader, subject: sources}
    may_produce:
      - evidence: e_opened
  merge.open:
    description: Open the merge once five readers ended complete.
    precondition:
      all:
        - {children: {in: [complete], subject: sources, count: 5}}
        - {claim: merge.opened, is: unknown}
    case_open: {protocol: merge, subject: merged}
    may_produce:
      - evidence: merge_opened

outcomes:
  nothing:
    description: Five readers ended complete and the merge found nothing.
    requires: {claim: merged.none}
  found:
    description: Five readers ended complete and the merge found something.
    requires: {claim: merged.none, is: "false"}
  partial:
    description: Five readers ended, one or more partial.
    requires:
      all:
        - {claim: readers.ended}
        - {claim: readers.complete, is: "false"}
  failed:
    description: A reader ended with an outcome no reader declares.
    requires: {claim: readers.ended, is: "false"}
  early:
    description: The probe of the count. Five readers ended while one is not yet opened.
    requires:
      all:
        - {claim: readers.ended}
        - any:
            - {claim: a.opened, is: unknown}
            - {claim: b.opened, is: unknown}
            - {claim: c.opened, is: unknown}
            - {claim: d.opened, is: unknown}
            - {claim: e.opened, is: unknown}
  nobody-after-incomplete-read:
    description: The probe of gap 8. The merge found nothing while a reader is not complete.
    requires:
      all:
        - {claim: merged.none}
        - any:
            - {claim: readers.complete, is: unknown}
            - {claim: readers.complete, is: "false"}
