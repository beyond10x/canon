format: protocol/1

protocol:
  id: simulate.at-open
  revision: 1
  description: Publish a report once a peer reviewed it in the review case; the opener hands the review in when it opens this case.

artifacts:
  report:
    description: The report being published.

evidence_kinds:
  peer_review:
    description: A peer's review of the report, recorded in a simulate.review case and handed in at open.
    supplied_by: simulate.review
    required_at_open: true
  publication:
    description: The published report.

claims:
  peer.reviewed:
    description: A peer reviewed the report.
    true_when:
      evidence:
        kind: peer_review

  report.published:
    description: The report has been published.
    true_when:
      evidence:
        kind: publication

actions:
  publish:
    description: Publish the report, once a peer reviewed it.
    precondition:
      claim: peer.reviewed
      is: true
    may_produce:
      - evidence: publication

outcomes:
  published:
    description: The report is published.
    requires:
      claim: report.published
