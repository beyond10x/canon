format: protocol/1

protocol:
  id: simulate.mutual
  revision: 1
  description: Seeded defect, a draft that needs a review and a review that needs a draft, so no case starts.

artifacts:
  paper:
    description: The paper being written.

evidence_kinds:
  draft:
    description: A draft of the paper.
  review:
    description: A review of the paper.

claims:
  paper.drafted:
    description: The paper has a draft.
    true_when:
      evidence:
        kind: draft

  paper.reviewed:
    description: The paper has a review.
    true_when:
      evidence:
        kind: review

actions:
  write_draft:
    description: Write a draft, which needs a review first.
    precondition:
      claim: paper.reviewed
      is: true
    may_produce:
      - evidence: draft

  review_draft:
    description: Review the draft, which needs a draft first.
    precondition:
      claim: paper.drafted
      is: true
    may_produce:
      - evidence: review

outcomes:
  done:
    description: The paper is drafted and reviewed.
    requires:
      all:
        - claim: paper.drafted
        - claim: paper.reviewed
