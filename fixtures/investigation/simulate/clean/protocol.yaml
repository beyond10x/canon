format: protocol/1

protocol:
  id: simulate.clean
  revision: 1
  description: Accept a report once a review accepts it; the review can be repeated until one does.

artifacts:
  report:
    description: The report under review.

evidence_kinds:
  review:
    description: A review of the report; its result is accepted or another.

claims:
  report.accepted:
    description: A review accepted the report.
    true_when:
      evidence:
        kind: review
        result: accepted

actions:
  review_report:
    description: Review the report.
    may_produce:
      - evidence: review

outcomes:
  accepted:
    description: The report is accepted.
    requires:
      claim: report.accepted
