format: protocol/1

# Redeclares the claim peer.approved, which investigation.review declares, without listing it under
# `refines`: refused as unrefined-redeclaration.

protocol:
  id: investigation
  revision: 1

imports:
  investigation.review:
    revision: 2
    digest: sha256:a9fb3b60e9273d62dba066655cdc016ee03bad1b6292d3a6eddd3d37b0d0ee2b

claims:
  peer.approved:
    description: A peer approved the finding.
    true_when:
