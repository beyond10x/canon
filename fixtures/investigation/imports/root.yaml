format: protocol/1

protocol:
  id: investigation
  revision: 3
  description: Decide whether an explanation is supported, and publish the finding once every obligation that applies to the case is discharged.

imports:
  investigation.falsification:
    revision: 1
    digest: sha256:2bc09ab698b6146c79a3d89543b2879bf0c19b9f36d2e6909ef2e4b8cc86aaa6
  investigation.review:
    revision: 2
    digest: sha256:a9fb3b60e9273d62dba066655cdc016ee03bad1b6292d3a6eddd3d37b0d0ee2b
    refines: [peer.approved]

claims:
  peer.approved:
    description: A peer approved the finding.
    true_when:
      evidence:
        kind: peer_review
        result: approved
  case.severe:
    description: The case is severe.
    true_when:
      input: severity
      in: [high]

obligations:
  peer.review:
    description: Have a peer review the finding of a severe case.
    applicable_when:
      claim: case.severe
    discharged_when:
      claim: peer.approved

outcomes:
  finding.published:
    description: The finding is published, with every obligation that applies to the case discharged.
    requires:
      all:
        - claim: explanation.supported
        - claim: falsification.attempted
        - any:
            - not:
                claim: case.severe
            - claim: peer.approved
