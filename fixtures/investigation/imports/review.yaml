format: protocol/1

protocol:
  id: investigation.review
  revision: 2
  description: Peer review of a finding observation supports, and the severity that decides whether a finding needs one.

imports:
  investigation.evidence:
    revision: 1
    digest: sha256:b25d25193ad45afd4bb182d0124f6ec8546a6c95dfb084049fb70dcef402d255

case:
  inputs:
    severity:
      description: How severe the case is; the finding of a severe case is reviewed by a peer before it is published.
      values: [low, high]

evidence_kinds:
  peer_review:
    description: A peer's review of the finding; its result is approved or rejected.

claims:
  peer.approved:
    description: A peer reviewed the finding.
    true_when:
      evidence:
        kind: peer_review

actions:
  request_review:
    description: Ask a peer to review a finding observation supports.
    precondition:
      claim: explanation.supported
    may_produce:
      - evidence: peer_review
