format: protocol/1

protocol:
  id: investigation.publication
  revision: 1
  description: Publish a finding observation supports once a peer approved it in the review case and its publication is approved.

artifacts:
  explanation:
    description: The explanation under investigation.

evidence_kinds:
  observation:
    description: An observation bearing on the explanation; its result is consistent or inconsistent.
  peer_review:
    description: A peer's review of the finding, recorded in an investigation.review case and copied here unchanged; its result is approved or rejected.
  publication_approval:
    description: An approval to publish the finding.

claims:
  explanation.supported:
    description: Observation is consistent with the explanation.
    true_when:
      evidence:
        kind: observation
        result: consistent

  peer.approved:
    description: A peer approved the finding.
    true_when:
      evidence:
        kind: peer_review
        result: approved

  publication.approved:
    description: Publishing the finding has been approved.
    true_when:
      evidence:
        kind: publication_approval

actions:
  inspect:
    description: Look for observations bearing on the explanation.
    may_produce:
      - evidence: observation

  approve_publication:
    description: Approve publishing the finding, under authority.
    requires:
      - capability: finding.approve
    may_produce:
      - evidence: publication_approval

  self_approve:
    description: Seeded defect, the same approval with no authority required.
    may_produce:
      - evidence: publication_approval

outcomes:
  approved_for_publication:
    description: The finding is supported, approved by a peer and its publication approved.
    requires:
      all:
        - claim: explanation.supported
        - claim: peer.approved
        - claim: publication.approved
