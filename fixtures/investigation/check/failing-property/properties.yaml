format: canon-properties/1
protocol: investigation

properties:
  inconclusive.rests.on.decision:
    description: Ending inconclusive rests on the explicit decision, never on the evidence about the explanation.
    subject:
      outcome: inconclusive
    independent_of:
      claim: explanation.supported

  publication.rests.on.authority:
    description: Seeded defect, publishing is declared independent of the evidence, but its precondition reads it.
    subject:
      action: publish_finding
    independent_of:
      claim: explanation.supported
