version: '3'

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: ESS gate, format, lint, test, generated documentation drift.
    cmds:
      - task: ess-gate
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - cargo test --workspace --locked
      - cargo run --locked -q -p canon-cli -- conform run --requirements conformance/requirements.yaml
      - cargo test -p b10x-canon --locked --test adversary_action_arguments
      - task: docs-check

  ess-gate:
    desc: Atlas ADR 0076 gate on ess/, and ess/ equal to the Rust model and the canon command line.
    cmds:
      - cargo test -p b10x-canon --test ess_gate --test ess_model_matches --locked
      - cargo test -p b10x-canon-expr --test model_matches --locked
      - cargo test -p canon-cli --test ess_commands_match --locked
      - cargo test -p canon-cli --test adversary_ess_commands --test adversary2_ess_commands --locked

  docs-generate:
    desc: Regenerate the derived documentation pages and landing data under website/, recording real canon runs.
    cmds:
      - cargo build --locked -p canon-cli
      - cargo run --locked -p canon-docs -- generate

  docs-check:
    desc: Fail when a generated documentation page differs from what the repository generates.
    cmds:
      - cargo build --locked -p canon-cli
      - cargo run --locked -p canon-docs -- generate --check

  docs-site-check:
    desc: The checks of a pull request that changes only the documentation site (answer docs-site-only of scripts/classify-changes.sh).
    cmds:
      - cargo test -p canon-docs --locked
      - cargo test -p b10x-canon --locked --test adversary_binding_docs --test adversary_obligations_docs --test adversary2_decisions_docs --test adversary2_binding_eval
      - task: docs-check

  site-build:
    desc: Build the Docusaurus documentation site (Node), after the drift check.
    cmds:
      - task: docs-check
      - npm --prefix website ci
      - npm --prefix website run build

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate
