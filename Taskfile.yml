version: '3'

vars:
  ESS_GATE_TESTS: >-
    binary_id(b10x-canon::ess_gate) | binary_id(b10x-canon::ess_model_matches) |
    binary_id(b10x-canon-expr::model_matches) | binary_id(canon-cli::ess_commands_match) |
    binary_id(canon-cli::adversary_ess_commands) | binary_id(canon-cli::adversary2_ess_commands)
  SHIPPED_FEATURES_TESTS: --test adversary_action_arguments

tasks:
  default:
    cmds: [{task: check}]

  check:
    desc: ESS gate, format, lint, test, generated documentation drift.
    cmds:
      - task: ess-gate
      - cargo fmt --all --check
      - cargo clippy --workspace --all-targets --locked -- -D warnings
      - task: test
        vars: {AFTER_ESS_GATE: "true"}
      - cargo run --locked -q -p canon-cli -- conform run --requirements conformance/requirements.yaml
      - task: docs-check

  ess-gate:
    desc: Atlas ADR 0076 gate on ess/, and ess/ equal to the Rust model and the canon command line.
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - silent: true
        cmd: |
          start=$(date +%s%N) status=0
          cargo nextest run --workspace --locked -E '{{.ESS_GATE_TESTS}}' || status=$?
          mkdir -p target/nextest
          echo $(( ($(date +%s%N) - start) / 1000000 )) > target/nextest/ess-gate.ms
          exit $status

  test:
    desc: "The gate's test step: every test once under cargo-nextest, a test killed at 60 s (.config/nextest.toml), the step failing over 120 s."
    vars:
      LIMIT: '{{.LIMIT | default "120"}}'
      AFTER_ESS_GATE: '{{.AFTER_ESS_GATE | default "false"}}'
    cmds:
      - cargo nextest run --workspace --locked --no-run
      - cargo nextest run -p b10x-canon --locked --no-run {{.SHIPPED_FEATURES_TESTS}}
      - silent: true
        cmd: |
          echo "test step: nproc $(nproc), nextest test threads $(nproc) (test-threads = num-cpus), bound {{.LIMIT}} s, a test killed at 60 s"
          ms() { echo $(( ($(date +%s%N) - $1) / 1000000 )); }
          s() { printf '%d.%01d' $(( $1 / 1000 )) $(( $1 % 1000 / 100 )); }
          gate=0 filter='all()' status=0
          if [ "{{.AFTER_ESS_GATE}}" = true ]; then
            gate=$(cat target/nextest/ess-gate.ms) filter='not ({{.ESS_GATE_TESTS}})'
          fi
          start=$(date +%s%N)
          cargo nextest run --workspace --locked -E "$filter" || status=$?
          workspace=$(ms $start)
          cp target/nextest/default/junit.xml target/nextest/workspace-junit.xml
          start=$(date +%s%N)
          cargo nextest run -p b10x-canon --locked {{.SHIPPED_FEATURES_TESTS}} || status=$?
          shipped=$(ms $start)
          total=$(( gate + workspace + shipped ))
          times=$(sed -n 's/.*<testcase name="\([^"]*\)" classname="\([^"]*\)".* time="\([0-9.]*\)".*/\3 \2 \1/p' \
            target/nextest/workspace-junit.xml target/nextest/default/junit.xml | sort -rn)
          echo "test step: ten slowest tests (s):"
          echo "$times" | head -10
          echo "test step: $(echo "$times" | awk '{ s += $1 } END { printf "%d tests, %.1f s summed", NR, s }') in this task"
          echo "test step: ess-gate $(s $gate) s + workspace $(s $workspace) s + -p b10x-canon $(s $shipped) s = $(s $total) s, bound {{.LIMIT}} s"
          if [ $total -gt $(( {{.LIMIT}} * 1000 )) ]; then
            echo "test step: FAILED, $(s $total) s is over the bound of {{.LIMIT}} s"
            exit 1
          fi
          exit $status

  docs-generate:
    desc: Regenerate the derived documentation pages and landing data under website/, recording real canon runs.
    cmds:
      - cargo build --locked -p canon-cli
      - cargo run --locked -p canon-docs -- generate

  docs-check:
    desc: Fail when a generated documentation page differs from what the repository generates.
    cmds:
      - cargo build --locked -p canon-cli
      - cargo run --locked -p canon-docs -- generate --check

  site-build:
    desc: Build the Docusaurus documentation site (Node), after the drift check.
    cmds:
      - task: docs-check
      - npm --prefix website ci
      - npm --prefix website run build

  plan:
    desc: Validate the AEP planning store.
    cmds:
      - aep plan artifact validate
