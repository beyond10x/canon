format: ess/20
system: canon
version: v1

summary: >-
  Canon's data model and command surface: the protocol/1 source model a protocol document is read
  into, and the canon-case/1, canon-evidence/1, canon-decisions/1 and canon-decision/1 documents an
  evaluation reads and writes, the canon-properties/1 document canon check reads, the
  canon-requirements/1 catalogue canon conform run reads, and the canon-trigger/1 rule document
  canon trigger validate reads (domain canon.trigger); and the canon command line, one command
  per subcommand with each flag an input (domain canon.cli). What a protocol means is Canon's own
  conformance suite, not this specification (Atlas ADR 0067 as amended by Atlas ADR 0076).

domains:
  - canon.protocol
  - canon.check
  - canon.expr
  - canon.conform
  - canon.trigger
  - canon.cli
