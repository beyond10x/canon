    of: String

  # read from: crates/canon/src/model/ids.rs:87-90
  - name: canon.protocol.ActionId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:91-94
  - name: canon.protocol.OutcomeId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:95-98
  - name: canon.protocol.CapabilityId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:99-102
  - name: canon.protocol.EffectClass
    kind: newtype
    of: String

  # read from: crates/canon/src/model/mod.rs:60-65
  - name: canon.protocol.Artifact
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:64
      - name: description
        type: Optional<String>

  # read from: crates/canon/src/model/mod.rs:179-198
  - name: canon.protocol.EvidenceKind
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:183-184
      - name: description
        type: Optional<String>
      # How old evidence of this kind may be and still apply. At an evaluation instant later than
      # a record's observed_at by more than this, the record is excluded as expired: an evidence
      # match it alone decided is unknown rather than false, and claims follow their predicates
      # (design § 8, CANON-EVIDENCE-002).
      # Declared on the evidence kind, not on an evidence match: expiry is a property of the
      # record, decided once per record before any claim is evaluated (story:evidence-freshness).
      # read from: .engineering/planning/story/evidence-freshness.md:40-45
      # read from: docs/design/canon-protocol-calculus-design.md:477
      - name: max_age
        type: Optional<canon.protocol.Age>
      # The protocol whose cases produce records of this kind (story:supplied-evidence): any
      # protocol but this one, its parent's, an ancestor's, a sibling's or a child's. It is a name,
      # like CaseOpening.protocol: compile, evaluate and check each read one document, and nothing
      # resolves it. The runner copies such a record unchanged from a case under that protocol.
      # canon validate refuses the protocol's own id (self-supplied-evidence), naming the kind.
      # canon check counts the kind as produced. A kind that declares supplied_by counts as
      # produced without authority and stays governed when an action that requires a capability
      # may also produce it, so canon check reports authority-bypass on an outcome a supplied
      # record alone makes legitimate. Absent, no key is compiled, so the canon-ir/1 of a
      # protocol without it is unchanged. A record of such a kind may name upstream artifacts this protocol does not
      # declare (EvidenceRecord.upstream_revisions).
      # read from: .engineering/planning/story/supplied-evidence.md:51-58
      # read from: .engineering/planning/story/supplied-evidence.md:185-191
      # read from: .engineering/planning/story/supplied-evidence.md:235-252
      # read from: crates/canon/src/model/mod.rs:189-197
      - name: supplied_by
        type: Optional<canon.protocol.ProtocolId>

  # read from: crates/canon/src/model/mod.rs:76-82
  - name: canon.protocol.Claim
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:80
      - name: description
        type: Optional<String>
      # read from: crates/canon/src/model/mod.rs:81
      - name: true_when
        type: canon.protocol.Predicate

  # read from: crates/canon/src/model/mod.rs:85-90
  - name: canon.protocol.Obligation
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:89
      - name: description
        type: Optional<String>
      # Required on every obligation: the obligation is discharged only when this predicate over
      # claim values evaluates true; unknown or false leaves it open (design § 8,
      # docs/design/canon-protocol-calculus-design.md:468). Its claim references resolve.
      # read from: .engineering/planning/story/evaluator-skeleton.md:91-92
      # read from: .engineering/planning/story/obligations.md:30-37
      - name: discharged_when
        type: canon.protocol.Predicate
      # When the obligation applies (story:case-inputs; the name the design gives the same guard on
      # actions). Optional: an obligation without one always applies, so no earlier expectation
      # changes. A predicate over claim values and case inputs, like discharged_when: canon validate
      # refuses an evidence match in it (evidence-in-applicability). FALSE: the obligation is
      # not_applicable and holds back nothing. Otherwise (TRUE or UNKNOWN) discharged_when decides:
      # TRUE discharges it, whatever its applicability; else it is open, and when its applicability
      # is UNKNOWN (a claim it tests is unknown) with reasons naming what is unknown, because unknown
      # is not false.
      # read from: .engineering/planning/story/case-inputs.md:82-90
      # read from: docs/design/canon-protocol-calculus-design.md:541
      - name: applicable_when
        type: Optional<canon.protocol.Predicate>

  # read from: crates/canon/src/model/mod.rs:94-107
  - name: canon.protocol.Action
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:98
      - name: description
        type: Optional<String>
      # read from: crates/canon/src/model/mod.rs:100
      - name: precondition
        type: Optional<canon.protocol.Predicate>
      # read from: crates/canon/src/model/mod.rs:102
      - name: requires
        type: List<canon.protocol.CapabilityRequirement>
      # read from: crates/canon/src/model/mod.rs:104
      - name: effect
        type: Optional<canon.protocol.EffectClass>
      # read from: crates/canon/src/model/mod.rs:106
      - name: may_produce
        type: List<canon.protocol.EvidenceProduction>
      # The kinds one run of the action records together, all of them or none
      # (story:simulate-record-groups). Absent means no group. canon validate refuses a group with
      # fewer than two distinct kinds, a kind its may_produce does not list, a kind an earlier
      # group of the action names, and case_outcome on an action that opens a child case (its
      # child's outcome arrives on its own), each as invalid-record-group naming the action. No
      # evaluation reads it: canon evaluate, canon check and canon generate give the same bytes
      # with or without it, and canon diff reports a group added, removed or changed as NO
      # SEMANTIC CHANGE. canon simulate adds a group's records in one step, one record of each
      # member kind, and never offers a grouped kind alone. canon-ir/1 writes
      # `"records_together"` only when the list is not empty, the groups sorted and the kinds
      # sorted within each group, each kind once.
      # read from: .engineering/planning/story/simulate-record-groups.md:48-67
      # read from: .engineering/planning/story/simulate-record-groups.md:233-235
      # read from: crates/canon/src/model/mod.rs:242-248
      - name: records_together
        type: List<canon.protocol.RecordGroup>
      # The one argument schema the action declares (story:action-arguments). Absent: the action
      # takes no arguments; a runner accepts only `{}`. Canon evaluates no call and never calls an
      # action. The library function b10x_canon::validate::check_arguments (story:argument-validator)
      # checks one call's arguments against this schema with JSON Schema 2020-12 meaning, reporting
      # every refusal; a runner uses it or any 2020-12 validator. The schema is a JSON
      # Schema in Canon's argument-schema dialect, a subset of JSON Schema 2020-12 with the same
      # meaning and no reference at all: every schema, the top level and each nested one, names
      # exactly one `type` (object, array, string, integer, number, boolean or null), the top level
      # `object`; `title` and `description` (strings) anywhere; `enum` on any type, a non-empty list
      # of distinct scalars of the schema's type; `properties`, `required` (distinct names, each
      # declared in `properties`) and `additionalProperties` (a boolean) on an object; `items`,
      # `minItems` and `maxItems` on an array; `minLength` and `maxLength` on a string; `minimum`
      # and `maximum` (integers) on an integer or a number; every length or count bound a
      # non-negative integer and every minimum at most its maximum; nesting within the depth bound
      # of predicates. Any other keyword, a keyword on a type it does not apply to, a list-valued
      # `type` and a schema-valued `additionalProperties` are refused by canon validate as
      # `action-arguments`, one problem per keyword, naming the action and the keyword's JSON
      # Pointer. Json here, not a typed schema: the dialect is checked by Canon's validator and its
      # conformance tests, like every other validation rule.
      # read from: .engineering/planning/story/action-arguments.md:36-72
      # read from: .engineering/planning/story/argument-validator.md:39-64
      - name: arguments
        type: Optional<Json>
      # The child case the action opens (story:case-composition, the action case.open of Atlas
      # ADR 0081): a case governed by the protocol `protocol`, about the declared artifact
      # `subject`. Absent: the action opens no case, and canon-ir/1 has no `case_open` key for it,
      # so the IR of every earlier protocol is unchanged. Canon opens nothing itself: the action is
      # admitted or blocked like any other, its authority requirements are its `requires`, like
      # those of any other action, and whoever takes it opens the child case. A case has one
      # commission, and a second party works through a child case: `case_open` is the one
      # primitive by which a case hands work to another party; Canon knows no commission and
      # counts none (D207). canon validate refuses a protocol id that is not an identifier
      # (invalid-identifier), naming the id as it names a malformed capability; a subject the
      # protocol does not declare (undeclared-artifact) and an opening under the protocol's own id
      # (self-opened-case, D206), each naming the action.
      # read from: .engineering/planning/story/case-composition.md:54-57
      # read from: .engineering/planning/story/case-composition.md:140-148
      # read from: crates/canon/src/model/mod.rs:212-218
      - name: case_open
        type: Optional<canon.protocol.CaseOpening>
      # Who writes the action's arguments and the content of the artifacts it revises
      # (story:judgement-marking): `program`, a reproducible function of the action's inputs, or
      # `judgement`, a person or a model. Absent means program. Canon gives it no evaluation
      # meaning: canon evaluate, canon check and canon generate give the same bytes with or without
      # it. It names no executor, harness, model or tool, and Canon cannot prove that a runner
      # honours it. canon-ir/1 writes `"author": "judgement"` only on a judgement action, so
      # `author: program` written out compiles to the bytes of no key. canon diff: program to
      # judgement is TIGHTENING, judgement to program RELAXATION, each naming the action.
      # read from: .engineering/planning/story/judgement-marking.md:50
      # read from: .engineering/planning/story/judgement-marking.md:53-57
      # read from: crates/canon/src/model/mod.rs:252-257
      - name: author
        type: Optional<canon.protocol.Author>
      # The artifacts the action may move to a new revision (story:judgement-marking). Absent
      # means none. canon validate refuses an id that is not a declared artifact
      # (undeclared-artifact), naming the action, after the evidence kinds it may produce and
      # before the subject of its case_open. canon-ir/1 writes `"revises"` only when the list is
      # not empty, sorted, each id once. No evaluation reads it, and Canon never refuses a runner
      # that moves an artifact outside it: that needs a record Canon does not receive. canon diff:
      # an artifact added is RELAXATION, one removed TIGHTENING, each naming the action and the
      # artifact.
      # read from: .engineering/planning/story/judgement-marking.md:51
      # read from: .engineering/planning/story/judgement-marking.md:53-57
      # read from: crates/canon/src/model/mod.rs:258-262
      - name: revises
        type: List<canon.protocol.ArtifactId>

  # Who decides a judgement-marked result (story:judgement-marking): `program`, a reproducible
  # procedure, or `judgement`, a person or a model. On an action (`author`) it says who writes its
  # arguments and the artifacts it revises; on a production (`decided_by`) who decides the record's
  # result. Neither has any evaluation meaning.
  # read from: .engineering/planning/story/judgement-marking.md:50-52
  # read from: .engineering/planning/story/judgement-marking.md:99
  # read from: crates/canon/src/model/mod.rs:265-275
  - name: canon.protocol.Author
    kind: enum
    variants: ["program", "judgement"]

  # What an action's `case_open` names: the protocol a child case is governed by and the artifact
  # it is about, never an existing case, so no run-time check guards against a case opening its
  # ancestor (D206). A protocol whose openings reach it again is refused statically instead: canon
  # validate refuses an opening under the protocol's own id, and a check over a set of compiled
  # protocols refuses a set whose openings form a cycle, naming the cycle by its protocol ids
  # from its least id, in the order its openings go, back to that id (`audit -> review -> audit`),
  # and accepts a set without one.
  # read from: .engineering/planning/story/case-composition.md:54-57
  # read from: .engineering/planning/story/case-composition.md:140-145
  # read from: crates/canon/src/model/mod.rs:221-235
  - name: canon.protocol.CaseOpening
    kind: struct
    fields:
      # The protocol the child case is governed by: an identifier.
      # read from: .engineering/planning/story/case-composition.md:54-57
      # read from: crates/canon/src/model/mod.rs:229-231
      - name: protocol
        type: canon.protocol.ProtocolId
      # The artifact the child case is about: one the protocol declares.
      # read from: .engineering/planning/story/case-composition.md:54-57
      # read from: crates/canon/src/model/mod.rs:232-234
      - name: subject
        type: canon.protocol.ArtifactId

  # One capability an action requires authority for, at a scope (Atlas ADR 0083 § Decision 1:
  # `metrics.inspect` requires `metrics.read{cluster, namespace}`). A requirement is decided from
  # the authority decisions on its capability that cover it (canon.protocol.AuthorityDecision): a
  # decision covers it when the requirement gives every scope key the decision gives a value for
  # that same value. A key the decision leaves out covers every value of it, and coverage never
  # widens inwards: a decision for {cluster: prod-eu, namespace: foo} does not cover a requirement
  # for {cluster: prod-eu}, and only a decision without a scope covers an unscoped requirement.
  # read from: crates/canon/src/model/mod.rs:237-248
  # read from: .engineering/planning/story/capability-scope.md:59-72
  # read from: .engineering/planning/story/capability-scope.md:159-163
  - name: canon.protocol.CapabilityRequirement
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:241-242
      - name: capability
        type: canon.protocol.CapabilityId
      # The scope the capability is required at: one value for each key it names, each key once
      # (canon validate refuses a key named twice as duplicate-scope-key, and a key or value that
      # is not an identifier as invalid-identifier). Absent or empty, the requirement is unscoped.
      # canon-ir/1 writes the scope only on a requirement that has one, so the canon-ir/1 of a
      # protocol without a scope is the one it was before scopes existed.
      # read from: crates/canon/src/model/mod.rs:243-247
      - name: scope
        type: Map<canon.protocol.ScopeKey, canon.protocol.ScopeValue>

  # read from: crates/canon/src/model/mod.rs:117-121
  - name: canon.protocol.EvidenceProduction
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:120
      - name: evidence
        type: canon.protocol.EvidenceKindId
      # Who decides the result of a record of this kind the action produces
      # (story:judgement-marking). Absent means the action's `author`. `decided_by: program` on a
      # judgement action covers a record the runner writes from the effect it applied, such as
      # provenance. No evaluation reads it. canon-ir/1 writes `"decided_by": "judgement"` only on
      # a production whose resolved value is judgement; when one action lists a kind twice,
      # judgement wins. canon diff: a production becoming judgement-decided is TIGHTENING, one
      # becoming program-decided RELAXATION, each naming the action and the kind.
      # read from: .engineering/planning/story/judgement-marking.md:52-56
      # read from: crates/canon/src/model/mod.rs:322-327
      - name: decided_by
        type: Optional<canon.protocol.Author>

  # One group of an action's records_together (story:simulate-record-groups): kinds one run of
  # the action records together, all of them or none. A named type, not a list of lists.
  # read from: .engineering/planning/story/simulate-record-groups.md:48-52
  # read from: crates/canon/src/model/mod.rs:340-348
  - name: canon.protocol.RecordGroup
    kind: struct
    fields:
      # The kinds of the group: two or more distinct kinds the action may produce.
      # read from: crates/canon/src/model/mod.rs:345-347
      - name: kinds
        type: List<canon.protocol.EvidenceKindId>

  # read from: crates/canon/src/model/mod.rs:124-130
  - name: canon.protocol.Outcome
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:128
      - name: description
        type: Optional<String>
      # What the outcome requires: a predicate over claim values and evidence, or an explicit
      # decision (story:decision-outcomes).
      # read from: crates/canon/src/model/mod.rs:129
      # read from: .engineering/planning/story/decision-outcomes.md:44-48
      - name: requires
        type: canon.protocol.OutcomeRequirement

  # Source text writes an outcome's `requires` as a predicate, or as a map with the one key
  # decision naming the explicit decision the outcome requires (design § 12:
  # `inconclusive: requires: decision: explicitly_inconclusive`); the typed model is this union.
  # Such an outcome is legitimate only with a canon-decisions/1 decision of that name, for that
  # outcome, taken at the case snapshot's current revision; it is blocked otherwise, naming the
  # decision (CANON-OUTCOME-002). A decision is a requirement on its own: it is not a predicate
  # form, so no claim, obligation or action precondition can name one.
  # read from: docs/design/canon-protocol-calculus-design.md:660-662
  # read from: .engineering/planning/story/decision-outcomes.md:44-54
  - name: canon.protocol.OutcomeRequirement
    kind: union
    tag: kind
    variants:
      # read from: crates/canon/src/model/mod.rs:129
      predicate: canon.protocol.Predicate
      # read from: docs/design/canon-protocol-calculus-design.md:662
      decision: canon.protocol.DecisionName

  # The name of an explicit decision an outcome requires (explicitly_inconclusive). An identifier:
  # not empty, no whitespace, control or Unicode format characters.
  # read from: docs/design/canon-protocol-calculus-design.md:662
  - name: canon.protocol.DecisionName
    kind: newtype
    of: String

  # Who took an explicit decision (lead-investigator) or an authority decision
  # (AuthorityDecision.principal, story:authority-revision-binding), or who produced an evidence
  # record (EvidenceRecord.producer, story:evidence-independence). Canon resolves no identity and
  # proves no production: the principal is recorded as given, an identifier like every other.
  # read from: .engineering/planning/story/decision-outcomes.md:47
  # read from: .engineering/planning/story/evidence-independence.md:68-69
  # read from: .engineering/planning/story/authority-revision-binding.md:57
  # read from: docs/design/canon-protocol-calculus-design.md:501
  - name: canon.protocol.Principal
    kind: newtype
    of: String

  # The identifier of an invalidation rule (story:invalidation-rules): not empty, no whitespace,
  # control or Unicode format characters, declared once.
  # read from: .engineering/planning/story/invalidation-rules.md:41-43
  # read from: docs/contracts/protocol-core.md:27
  - name: canon.protocol.InvalidationRuleId
    kind: newtype
    of: String

  # An invalidation rule (design § 4.1, contract sketch InvalidationRule, CANON-INVALIDATION-001):
  # it names an upstream artifact and the claims whose support a change of that artifact's
  # revision invalidates. An evidence record that records a revision of the upstream artifact
  # (EvidenceRecord.upstream_revisions) other than the case snapshot's current revision of it is
  # invalidated for each claim the rule names and for every claim built on one of them, through
  # any number of claim references. A claim is evaluated without the records invalidated for it
  # anywhere in its evaluation, including in every claim it tests: a tested claim is evaluated, for
  # that use, without the records invalidated for either of them, while its own reported value
  # uses its own. A record invalidated for a claim is listed in that claim's excluded_evidence, with
  # reason invalidated, when an evidence match the claim reaches reads it. A named claim loses the
  # support such a record gave, and claims built on it follow their predicates. Every other claim
  # keeps the record and does not list it, even one that reads the same kind. A record that
  # records no revision of the upstream artifact is not invalidated by the rule. canon validate
  # refuses a rule whose upstream artifact the protocol does not declare (undeclared-artifact), one
  # naming a claim it does not declare (undeclared-claim), and one naming a claim that reaches no
  # evidence match, in its own predicate or in a claim it tests (inert-invalidation), each naming
  # the rule and what it names.
  # read from: .engineering/planning/story/invalidation-rules.md:41-46
  # read from: .engineering/planning/story/invalidation-rules.md:50-52
  # read from: docs/contracts/protocol-core.md:27
  # read from: docs/design/canon-protocol-calculus-design.md:1450-1452
  - name: canon.protocol.InvalidationRule
    kind: struct
    fields:
      # read from: .engineering/planning/story/invalidation-rules.md:41-43
      - name: description
        type: Optional<String>
      # The artifact whose revision the rule watches; one the protocol declares.
      # read from: .engineering/planning/story/invalidation-rules.md:42-43
      - name: upstream
        type: canon.protocol.ArtifactId
      # The claims whose support the rule invalidates; each one the protocol declares. A set:
      # canon-ir/1 lists each once, in identifier order.
      # read from: .engineering/planning/story/invalidation-rules.md:42-44
      - name: invalidates
        type: List<canon.protocol.ClaimId>

  # The identifier of a case input a protocol declares (story:case-inputs): not empty, no
  # whitespace, control or Unicode format characters, declared once.
  # read from: .engineering/planning/story/case-inputs.md:66-68
  - name: canon.protocol.InputId
    kind: newtype
    of: String

  # One value a case input may take, an identifier its input declares. A case gives one per input;
  # an input predicate lists the ones it is true for. Read alike in the protocol and in the case: a
  # scalar written unquoted as a boolean or a number (`true`, `2`) is read as its text in both, so
  # a value one accepts the other accepts.
  # read from: .engineering/planning/story/case-inputs.md:66-81
  - name: canon.protocol.InputValue
    kind: newtype
    of: String

  # The protocol's `case:` section (design sketch, `case: inputs:`): what a case governed by the
  # protocol gives when it opens. A protocol without the section declares no input, and its
  # canon-ir/1 has no `case` key, so the IR of every earlier protocol is unchanged.
  # read from: .engineering/planning/story/case-inputs.md:66-70
  # read from: docs/design/canon-protocol-calculus-design.md:631-634
