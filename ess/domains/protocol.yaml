# Retrofitted from the protocol/1 source model in crates/canon/src/model/ (story:protocol-source-model).
# This is the typed model, not the protocol/1 surface syntax: parsing that syntax, and every
# validation rule (duplicate identifiers, references that resolve), is tested by Canon itself.
# The evaluation documents (canon-case/1, canon-evidence/1, canon-decision/1) are specified first
# here (story:three-valued-claims), and the explicit decisions an evaluation reads
# (canon-decisions/1) too (story:decision-outcomes), and the authority decisions it reads
# (canon-authority/1, story:review-hardening-w7). story:case-inputs adds the case inputs a protocol
# declares and a case gives values for, the input predicate and an obligation's applicability.
# story:evidence-order-predicate adds the order forms `first` and `before` of the predicate,
# story:evidence-order-after the order form `after`, and story:evidence-order-since the order form
# `since`.
# story:evidence-independence adds the independence dimensions a protocol declares, the
# independence an evidence match demands of its records, the producer an evidence record names and
# the independence a case gives each producer. story:action-arguments adds the argument schema an
# action declares.
# crates/canon/tests/ess_model_matches.rs keeps this file and the Rust model equal.
domain: canon.protocol

summary: >-
  A protocol document: its identity and revision, the case inputs it declares, and the artifacts,
  evidence kinds, claims, obligations, actions, outcomes and invalidation rules it declares. A
  predicate over evidence, claim values and case inputs decides each claim and guards each action,
  decides when an obligation applies, and states what each outcome requires unless the outcome
  requires an explicit decision instead. A case governed by a protocol is evaluated from a case
  snapshot, which gives a value for each case input, evidence records and explicit decisions into a
  decision that gives each claim a three-valued truth value.

naming:
  wire: protocol
  display: Protocol

types:
  # read from: crates/canon/src/model/ids.rs:55-58
  - name: canon.protocol.ProtocolId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:63-66
  - name: canon.protocol.ArtifactId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:79-82
  - name: canon.protocol.EvidenceKindId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:71-74
  - name: canon.protocol.ClaimId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:83-86
  - name: canon.protocol.ObligationId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:87-90
  - name: canon.protocol.ActionId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:91-94
  - name: canon.protocol.OutcomeId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:95-98
  - name: canon.protocol.CapabilityId
    kind: newtype
    of: String

  # read from: crates/canon/src/model/ids.rs:99-102
  - name: canon.protocol.EffectClass
    kind: newtype
    of: String

  # read from: crates/canon/src/model/mod.rs:60-65
  - name: canon.protocol.Artifact
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:64
      - name: description
        type: Optional<String>

  # read from: crates/canon/src/model/mod.rs:68-73
  - name: canon.protocol.EvidenceKind
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:72
      - name: description
        type: Optional<String>
      # How old evidence of this kind may be and still apply. At an evaluation instant later than
      # a record's observed_at by more than this, the record is excluded as expired: an evidence
      # match it alone decided is unknown rather than false, and claims follow their predicates
      # (design § 8, CANON-EVIDENCE-002).
      # Declared on the evidence kind, not on an evidence match: expiry is a property of the
      # record, decided once per record before any claim is evaluated (story:evidence-freshness).
      # read from: .engineering/planning/story/evidence-freshness.md:40-45
      # read from: docs/design/canon-protocol-calculus-design.md:477
      - name: max_age
        type: Optional<canon.protocol.Age>

  # read from: crates/canon/src/model/mod.rs:76-82
  - name: canon.protocol.Claim
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:80
      - name: description
        type: Optional<String>
      # read from: crates/canon/src/model/mod.rs:81
      - name: true_when
        type: canon.protocol.Predicate

  # read from: crates/canon/src/model/mod.rs:85-90
  - name: canon.protocol.Obligation
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:89
      - name: description
        type: Optional<String>
      # Required on every obligation: the obligation is discharged only when this predicate over
      # claim values evaluates true; unknown or false leaves it open (design § 8,
      # docs/design/canon-protocol-calculus-design.md:468). Its claim references resolve.
      # read from: .engineering/planning/story/evaluator-skeleton.md:91-92
      # read from: .engineering/planning/story/obligations.md:30-37
      - name: discharged_when
        type: canon.protocol.Predicate
      # When the obligation applies (story:case-inputs; the name the design gives the same guard on
      # actions). Optional: an obligation without one always applies, so no earlier expectation
      # changes. A predicate over claim values and case inputs, like discharged_when: canon validate
      # refuses an evidence match in it (evidence-in-applicability). FALSE: the obligation is
      # not_applicable and holds back nothing. Otherwise (TRUE or UNKNOWN) discharged_when decides:
      # TRUE discharges it, whatever its applicability; else it is open, and when its applicability
      # is UNKNOWN (a claim it tests is unknown) with reasons naming what is unknown, because unknown
      # is not false.
      # read from: .engineering/planning/story/case-inputs.md:82-90
      # read from: docs/design/canon-protocol-calculus-design.md:541
      - name: applicable_when
        type: Optional<canon.protocol.Predicate>

  # read from: crates/canon/src/model/mod.rs:94-107
  - name: canon.protocol.Action
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:98
      - name: description
        type: Optional<String>
      # read from: crates/canon/src/model/mod.rs:100
      - name: precondition
        type: Optional<canon.protocol.Predicate>
      # read from: crates/canon/src/model/mod.rs:102
      - name: requires
        type: List<canon.protocol.CapabilityRequirement>
      # read from: crates/canon/src/model/mod.rs:104
      - name: effect
        type: Optional<canon.protocol.EffectClass>
      # read from: crates/canon/src/model/mod.rs:106
      - name: may_produce
        type: List<canon.protocol.EvidenceProduction>
      # The one argument schema the action declares (story:action-arguments). Absent: the action
      # takes no arguments; a runner accepts only `{}`. Canon never validates arguments at run
      # time: the runner that calls the action validates them against this schema. The schema is a JSON
      # Schema in Canon's argument-schema dialect, a subset of JSON Schema 2020-12 with the same
      # meaning and no reference at all: every schema, the top level and each nested one, names
      # exactly one `type` (object, array, string, integer, number, boolean or null), the top level
      # `object`; `title` and `description` (strings) anywhere; `enum` on any type, a non-empty list
      # of distinct scalars of the schema's type; `properties`, `required` (distinct names, each
      # declared in `properties`) and `additionalProperties` (a boolean) on an object; `items`,
      # `minItems` and `maxItems` on an array; `minLength` and `maxLength` on a string; `minimum`
      # and `maximum` (integers) on an integer or a number; every length or count bound a
      # non-negative integer and every minimum at most its maximum; nesting within the depth bound
      # of predicates. Any other keyword, a keyword on a type it does not apply to, a list-valued
      # `type` and a schema-valued `additionalProperties` are refused by canon validate as
      # `action-arguments`, one problem per keyword, naming the action and the keyword's JSON
      # Pointer. Json here, not a typed schema: the dialect is checked by Canon's validator and its
      # conformance tests, like every other validation rule.
      # read from: .engineering/planning/story/action-arguments.md:36-72
      - name: arguments
        type: Optional<Json>

  # read from: crates/canon/src/model/mod.rs:110-114
  - name: canon.protocol.CapabilityRequirement
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:113
      - name: capability
        type: canon.protocol.CapabilityId

  # read from: crates/canon/src/model/mod.rs:117-121
  - name: canon.protocol.EvidenceProduction
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:120
      - name: evidence
        type: canon.protocol.EvidenceKindId

  # read from: crates/canon/src/model/mod.rs:124-130
  - name: canon.protocol.Outcome
    kind: struct
    fields:
      # read from: crates/canon/src/model/mod.rs:128
      - name: description
        type: Optional<String>
      # What the outcome requires: a predicate over claim values and evidence, or an explicit
      # decision (story:decision-outcomes).
      # read from: crates/canon/src/model/mod.rs:129
      # read from: .engineering/planning/story/decision-outcomes.md:44-48
      - name: requires
        type: canon.protocol.OutcomeRequirement

  # Source text writes an outcome's `requires` as a predicate, or as a map with the one key
  # decision naming the explicit decision the outcome requires (design § 12:
  # `inconclusive: requires: decision: explicitly_inconclusive`); the typed model is this union.
  # Such an outcome is legitimate only with a canon-decisions/1 decision of that name, for that
  # outcome, taken at the case snapshot's current revision; it is blocked otherwise, naming the
  # decision (CANON-OUTCOME-002). A decision is a requirement on its own: it is not a predicate
  # form, so no claim, obligation or action precondition can name one.
  # read from: docs/design/canon-protocol-calculus-design.md:660-662
  # read from: .engineering/planning/story/decision-outcomes.md:44-54
  - name: canon.protocol.OutcomeRequirement
    kind: union
    tag: kind
    variants:
      # read from: crates/canon/src/model/mod.rs:129
      predicate: canon.protocol.Predicate
      # read from: docs/design/canon-protocol-calculus-design.md:662
      decision: canon.protocol.DecisionName

  # The name of an explicit decision an outcome requires (explicitly_inconclusive). An identifier:
  # not empty, no whitespace, control or Unicode format characters.
  # read from: docs/design/canon-protocol-calculus-design.md:662
  - name: canon.protocol.DecisionName
    kind: newtype
    of: String

  # Who took an explicit decision (lead-investigator), or who produced an evidence record
  # (EvidenceRecord.producer, story:evidence-independence). Canon resolves no identity and proves
  # no production: the principal is recorded as given, an identifier like every other.
  # read from: .engineering/planning/story/decision-outcomes.md:47
  # read from: .engineering/planning/story/evidence-independence.md:68-69
  # read from: docs/design/canon-protocol-calculus-design.md:501
  - name: canon.protocol.Principal
    kind: newtype
    of: String

  # The identifier of an invalidation rule (story:invalidation-rules): not empty, no whitespace,
  # control or Unicode format characters, declared once.
  # read from: .engineering/planning/story/invalidation-rules.md:41-43
  # read from: docs/contracts/protocol-core.md:27
  - name: canon.protocol.InvalidationRuleId
    kind: newtype
    of: String

  # An invalidation rule (design § 4.1, contract sketch InvalidationRule, CANON-INVALIDATION-001):
  # it names an upstream artifact and the claims whose support a change of that artifact's
  # revision invalidates. An evidence record that records a revision of the upstream artifact
  # (EvidenceRecord.upstream_revisions) other than the case snapshot's current revision of it is
  # invalidated for each claim the rule names and for every claim built on one of them, through
  # any number of claim references. A claim is evaluated without the records invalidated for it
  # anywhere in its evaluation, including in every claim it tests: a tested claim is evaluated, for
  # that use, without the records invalidated for either of them, while its own reported value
  # uses its own. A record invalidated for a claim is listed in that claim's excluded_evidence, with
  # reason invalidated, when an evidence match the claim reaches reads it. A named claim loses the
  # support such a record gave, and claims built on it follow their predicates. Every other claim
  # keeps the record and does not list it, even one that reads the same kind. A record that
  # records no revision of the upstream artifact is not invalidated by the rule. canon validate
  # refuses a rule whose upstream artifact the protocol does not declare (undeclared-artifact), one
  # naming a claim it does not declare (undeclared-claim), and one naming a claim that reaches no
  # evidence match, in its own predicate or in a claim it tests (inert-invalidation), each naming
  # the rule and what it names.
  # read from: .engineering/planning/story/invalidation-rules.md:41-46
  # read from: .engineering/planning/story/invalidation-rules.md:50-52
  # read from: docs/contracts/protocol-core.md:27
  # read from: docs/design/canon-protocol-calculus-design.md:1450-1452
  - name: canon.protocol.InvalidationRule
    kind: struct
    fields:
      # read from: .engineering/planning/story/invalidation-rules.md:41-43
      - name: description
        type: Optional<String>
      # The artifact whose revision the rule watches; one the protocol declares.
      # read from: .engineering/planning/story/invalidation-rules.md:42-43
      - name: upstream
        type: canon.protocol.ArtifactId
      # The claims whose support the rule invalidates; each one the protocol declares. A set:
      # canon-ir/1 lists each once, in identifier order.
      # read from: .engineering/planning/story/invalidation-rules.md:42-44
      - name: invalidates
        type: List<canon.protocol.ClaimId>

  # The identifier of a case input a protocol declares (story:case-inputs): not empty, no
  # whitespace, control or Unicode format characters, declared once.
  # read from: .engineering/planning/story/case-inputs.md:66-68
  - name: canon.protocol.InputId
    kind: newtype
    of: String

  # One value a case input may take, an identifier its input declares. A case gives one per input;
  # an input predicate lists the ones it is true for. Read alike in the protocol and in the case: a
  # scalar written unquoted as a boolean or a number (`true`, `2`) is read as its text in both, so
  # a value one accepts the other accepts.
  # read from: .engineering/planning/story/case-inputs.md:66-81
  - name: canon.protocol.InputValue
    kind: newtype
    of: String

  # The protocol's `case:` section (design sketch, `case: inputs:`): what a case governed by the
  # protocol gives when it opens. A protocol without the section declares no input, and its
  # canon-ir/1 has no `case` key, so the IR of every earlier protocol is unchanged.
  # read from: .engineering/planning/story/case-inputs.md:66-70
  # read from: docs/design/canon-protocol-calculus-design.md:631-634
  - name: canon.protocol.CaseSection
    kind: struct
    fields:
      # The case inputs, keyed by input id.
      # read from: .engineering/planning/story/case-inputs.md:66-68
      - name: inputs
        type: Map<canon.protocol.InputId, canon.protocol.CaseInput>

  # One case input: configuration a case fixes when it opens, not evidence, so no evaluation has an
  # unknown input. A closed set of identifiers: the design sketch's `type: string` is not taken,
  # since a free-text input could select no rule. canon validate refuses an input that declares no
  # value (empty-input-values) and one that lists a value twice (duplicate-input-value), each naming
  # the input, and the second the value. A set: canon-ir/1 lists each value once, in identifier
  # order.
  # read from: .engineering/planning/story/case-inputs.md:66-70
  - name: canon.protocol.CaseInput
    kind: struct
    fields:
      # read from: .engineering/planning/story/case-inputs.md:68
      - name: description
        type: Optional<String>
      # The values the input may take: closed and not empty.
      # read from: .engineering/planning/story/case-inputs.md:67-69
      - name: values
        type: List<canon.protocol.InputValue>

  # An input predicate leaf, written `{input: <id>, in: [<value>, ...]}`: true when the case's value
  # of the input is one of the values listed, false otherwise; never unknown, since a case gives
  # every declared input. canon validate refuses an input the protocol does not declare
  # (undeclared-input), a listed value the input does not declare (undeclared-input-value), an
  # empty `in` list (empty-input-test) and a value listed twice in it
  # (duplicate-input-test-value), each naming the declaration it is written in and the input, and
  # the value where there is one. canon-ir/1 writes it
  # `{"input": {"id": <id>, "in": [...]}}`, its values each once, in identifier order.
  # read from: .engineering/planning/story/case-inputs.md:77-81
  # read from: crates/canon/src/model/predicate.rs:242-249
  - name: canon.protocol.InputTest
    kind: struct
    fields:
      # read from: .engineering/planning/story/case-inputs.md:77
      # read from: crates/canon/src/model/predicate.rs:246
      - name: input
        type: canon.protocol.InputId
      # read from: .engineering/planning/story/case-inputs.md:77-78
      # read from: crates/canon/src/model/predicate.rs:247-248
      - name: in
        type: List<canon.protocol.InputValue>

  # The identifier of an independence dimension a protocol declares (story:evidence-independence):
  # not empty, no whitespace, control or Unicode format characters, declared once. Canon gives no
  # dimension a meaning; a domain names them (different_principal, different_agent_run).
  # read from: .engineering/planning/story/evidence-independence.md:63-65
  - name: canon.protocol.IndependenceDimensionId
    kind: newtype
    of: String

  # One independence dimension, declared in the protocol's `independence_dimensions` section. A
  # dimension is a relation between who produced a record and the case's work that the trusted
  # context resolves for each producer (design § 39.4); Canon only reads the result, from the case.
  # read from: .engineering/planning/story/evidence-independence.md:63-65
  # read from: docs/design/canon-protocol-calculus-design.md:1665
  - name: canon.protocol.IndependenceDimension
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-independence.md:63-64
      - name: description
        type: Optional<String>

  # A three-valued truth value; unknown is not false.
  # read from: crates/canon/src/model/predicate.rs:60-66
  - name: canon.protocol.Truth
    kind: enum
    variants: ["true", "false", "unknown"]

  # Source text writes a predicate as a map with exactly one of the keys all, any, not, evidence,
  # claim, input, first, before, after or since (crates/canon/src/model/predicate.rs); the typed
  # model is this union.
  # read from: crates/canon/src/model/predicate.rs:101-125
  # read from: .engineering/planning/story/evidence-order-predicate.md:71-74
  # read from: .engineering/planning/story/evidence-order-after.md:70-75
  # read from: .engineering/planning/story/evidence-order-since.md:33-38
  - name: canon.protocol.Predicate
    kind: union
    tag: kind
    variants:
      # read from: crates/canon/src/model/predicate.rs:106
      all: List<canon.protocol.Predicate>
      # read from: crates/canon/src/model/predicate.rs:108
      any: List<canon.protocol.Predicate>
      # read from: crates/canon/src/model/predicate.rs:109
      not: canon.protocol.Predicate
      # read from: crates/canon/src/model/predicate.rs:110
      evidence: canon.protocol.EvidenceMatch
      # read from: crates/canon/src/model/predicate.rs:124
      claim: canon.protocol.ClaimTest
      # read from: .engineering/planning/story/case-inputs.md:77-81
      # read from: crates/canon/src/model/predicate.rs:111-112
      input: canon.protocol.InputTest
      # Whether the first record of a kind has a result (story:evidence-order-predicate).
      # read from: .engineering/planning/story/evidence-order-predicate.md:65-66
      # read from: crates/canon/src/model/predicate.rs:113-114
      first: canon.protocol.FirstResult
      # Whether the first record of one kind was observed strictly before the first of another.
      # read from: .engineering/planning/story/evidence-order-predicate.md:67-69
      # read from: crates/canon/src/model/predicate.rs:115-117
      before: canon.protocol.EvidenceOrder
      # Whether a record of a kind with a result was observed strictly after the first record of
      # another kind, or of the same one (story:evidence-order-after).
      # read from: .engineering/planning/story/evidence-order-after.md:70-75
      # read from: crates/canon/src/model/predicate.rs:118-120
      after: canon.protocol.EvidenceAfter
      # Whether a record of a kind with a result, at the subject revision of the latest record of
      # another kind (or of the same one), was observed after it (story:evidence-order-since).
      # read from: .engineering/planning/story/evidence-order-since.md:33-38
      # read from: crates/canon/src/model/predicate.rs:121-123
      since: canon.protocol.EvidenceSince

  # read from: crates/canon/src/model/predicate.rs:216-233
  - name: canon.protocol.EvidenceMatch
    kind: struct
    fields:
      # read from: crates/canon/src/model/predicate.rs:224
      - name: kind
        type: canon.protocol.EvidenceKindId
      # read from: crates/canon/src/model/predicate.rs:226
      - name: result
        type: Optional<String>
      # The declared artifact a record must be about to match. A match that names one is decided
      # only by records whose subject is that artifact; a record about another declared artifact,
      # at its current revision, is not of the match, so it neither establishes nor contradicts it
      # (CANON-EVIDENCE-003). A match without one is decided by records about any declared
      # artifact, as before. It names an artifact the protocol declares.
      # read from: .engineering/planning/story/subject-bound-evidence-match.md:13-16
      # read from: .engineering/planning/story/subject-bound-evidence-match.md:26-28
      # read from: crates/canon/src/model/predicate.rs:228
      - name: subject
        type: Optional<canon.protocol.ArtifactId>
      # The independence the match demands of its records (story:evidence-independence): a record
      # is of the match only when it names a producer and the case lists every dimension named here
      # for that producer. A record of the match's kind and subject that fails it is excluded from
      # the match with the reason not_independent, whatever its result, so a match that only such
      # records would decide is unknown, not false (CANON-INDEPENDENCE-001). A match without it
      # reads its records as before. canon validate refuses an empty list
      # (empty-independent-on), a dimension listed twice (duplicate-independent-on) and one the
      # protocol does not declare (undeclared-dimension), each naming the declaration it is written
      # in, and the dimension where there is one. A set: canon-ir/1 lists each dimension once, in
      # identifier order, and writes the key only when the match names it.
      # read from: .engineering/planning/story/evidence-independence.md:66-67
      # read from: .engineering/planning/story/evidence-independence.md:74-80
      # read from: docs/design/canon-protocol-calculus-design.md:1442-1444
      - name: independent_on
        type: Optional<List<canon.protocol.IndependenceDimensionId>>

  # An order form: whether the first record of `kind` (about `subject` when named) has `result`.
  # It reads the history: every record of its kind the evidence check accepted, including those
  # the exclusion stages keep from evidence matches (revision_mismatch, expired, invalidated). The
  # order key is a record's observed_at, read at the evaluation's resolution (the coarsest
  # precision written among the records with an observed_at, finer digits dropped); a record
  # without one leaves the order unknown. Of the records at the earliest instant at the
  # evaluation's resolution, every one with the result is true, none is false, some is unknown; no
  # record is unknown. What it means is CANON-ORDER-001 (conformance/scenarios/evidence-order.yaml)
  # and CANON-ORDER-003 (conformance/scenarios/evidence-order-subsecond.yaml), not this file.
  # read from: .engineering/planning/story/evidence-order-predicate.md:65-66
  # read from: .engineering/planning/story/evidence-order-predicate.md:76-95
  # read from: .engineering/planning/story/evidence-order-subsecond.md:40-66
  # read from: crates/canon/src/model/predicate.rs:127-142
  - name: canon.protocol.FirstResult
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-order-predicate.md:65-66
      # read from: crates/canon/src/model/predicate.rs:133-135
      - name: kind
        type: canon.protocol.EvidenceKindId
      # read from: .engineering/planning/story/evidence-order-predicate.md:65-66
      # read from: crates/canon/src/model/predicate.rs:136-138
      - name: result
        type: String
      # A declared artifact: only records about it are read.
      # read from: .engineering/planning/story/evidence-order-predicate.md:65-66
      # read from: crates/canon/src/model/predicate.rs:139-141
      - name: subject
        type: Optional<canon.protocol.ArtifactId>

  # An order form: whether the first record of kind `first` was observed strictly before the first
  # record of kind `then` (both about `subject` when named), read from the history as FirstResult
  # is. No record of either is unknown; one of `then` and none of `first` is false; one of `first`
  # and none of `then` is unknown; a record of either without observed_at is unknown; otherwise the
  # earliest instants at the evaluation's resolution decide, an equal pair unknown. `first` and
  # `then` are two different declared kinds.
  # read from: .engineering/planning/story/evidence-order-predicate.md:67-69
  # read from: .engineering/planning/story/evidence-order-predicate.md:97-104
  # read from: .engineering/planning/story/evidence-order-predicate.md:108-110
  # read from: .engineering/planning/story/evidence-order-subsecond.md:40-66
  # read from: crates/canon/src/model/predicate.rs:144-161
  - name: canon.protocol.EvidenceOrder
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-order-predicate.md:67-69
      # read from: crates/canon/src/model/predicate.rs:151-153
      - name: first
        type: canon.protocol.EvidenceKindId
      # read from: .engineering/planning/story/evidence-order-predicate.md:67-69
      # read from: crates/canon/src/model/predicate.rs:154-156
      - name: then
        type: canon.protocol.EvidenceKindId
      # A declared artifact: only records about it are read, of either kind.
      # read from: .engineering/planning/story/evidence-order-predicate.md:67-69
      # read from: crates/canon/src/model/predicate.rs:157-160
      - name: subject
        type: Optional<canon.protocol.ArtifactId>

  # An order form: whether some record of kind `then.kind` with result `then.result` was observed
  # strictly after the first record of kind `first` (all about `subject` when named), read from the
  # history as FirstResult is. No record of `first` is unknown; no record of `then.kind` with the
  # result is false; a record of `first`, or of `then.kind` with the result, without observed_at
  # is unknown; otherwise one observed after the earliest instant of `first` at the evaluation's
  # resolution is true, one only at that instant (other than the first record itself) is unknown,
  # and none is false. A record of `then.kind` with another result takes no part. `first` and
  # `then.kind` may be one kind; a record is not later than itself. What it means is
  # CANON-ORDER-002 (conformance/scenarios/evidence-order-after.yaml) and CANON-ORDER-003, not this
  # file.
  # read from: .engineering/planning/story/evidence-order-after.md:70-75
  # read from: .engineering/planning/story/evidence-order-after.md:89-111
  # read from: .engineering/planning/story/evidence-order-subsecond.md:40-66
  # read from: crates/canon/src/model/predicate.rs:163-181
  - name: canon.protocol.EvidenceAfter
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-order-after.md:70-72
      # read from: crates/canon/src/model/predicate.rs:171-173
      - name: first
        type: canon.protocol.EvidenceKindId
      # read from: .engineering/planning/story/evidence-order-after.md:70-72
      # read from: crates/canon/src/model/predicate.rs:174-176
      - name: then
        type: canon.protocol.LaterRecord
      # A declared artifact: only records about it are read, of either kind.
      # read from: .engineering/planning/story/evidence-order-after.md:70-72
      # read from: crates/canon/src/model/predicate.rs:177-180
      - name: subject
        type: Optional<canon.protocol.ArtifactId>

  # An order form: whether a record of kind `then.kind` with result `then.result`, about the
  # subject and subject revision of the latest record of kind `last`, was observed after that
  # record (all about `subject` when named), read from the history as FirstResult is. The anchors
  # are the records of `last`, the candidates the records of `then.kind` with the result, and the
  # latest anchors those no anchor is observed after. No anchor is unknown; no candidate is false;
  # an anchor or a candidate without observed_at is unknown. Otherwise each latest anchor gives
  # true when a candidate at its subject and subject revision, other than itself, is observed
  # after it, false when every such candidate is observed before it or there is none, and unknown
  # otherwise; the form is true when every latest anchor gives true, false when every one gives
  # false, and unknown otherwise. `last` and `then.kind` may be one kind; a record is not later
  # than itself. What it means is CANON-ORDER-004
  # (conformance/scenarios/evidence-order-since.yaml), not this file.
  # read from: .engineering/planning/story/evidence-order-since.md:33-38
  # read from: .engineering/planning/story/evidence-order-since.md:49-61
  # read from: crates/canon/src/model/predicate.rs:183-201
  - name: canon.protocol.EvidenceSince
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-order-since.md:33-36
      # read from: crates/canon/src/model/predicate.rs:191-193
      - name: last
        type: canon.protocol.EvidenceKindId
      # read from: .engineering/planning/story/evidence-order-since.md:33-38
      # read from: crates/canon/src/model/predicate.rs:194-196
      - name: then
        type: canon.protocol.LaterRecord
      # A declared artifact: only records about it are read, of either kind.
      # read from: .engineering/planning/story/evidence-order-since.md:33-36
      # read from: crates/canon/src/model/predicate.rs:197-200
      - name: subject
        type: Optional<canon.protocol.ArtifactId>

  # What an `after` reads later than the first record of its `first` kind, and a `since` later than
  # the latest record of its `last` kind: a record of `kind` with `result`.
  # read from: .engineering/planning/story/evidence-order-after.md:70-75
  # read from: .engineering/planning/story/evidence-order-since.md:37-38
  # read from: crates/canon/src/model/predicate.rs:203-214
  - name: canon.protocol.LaterRecord
    kind: struct
    fields:
      # read from: .engineering/planning/story/evidence-order-after.md:70-72
      # read from: crates/canon/src/model/predicate.rs:208-210
      - name: kind
        type: canon.protocol.EvidenceKindId
      # read from: .engineering/planning/story/evidence-order-after.md:70-72
      # read from: crates/canon/src/model/predicate.rs:211-213
      - name: result
        type: String

  # Source text may leave `is` out; it then reads as true (crates/canon/src/model/predicate.rs:447).
  # read from: crates/canon/src/model/predicate.rs:235-240
  - name: canon.protocol.ClaimTest
    kind: struct
    fields:
      # read from: crates/canon/src/model/predicate.rs:238
      - name: claim
        type: canon.protocol.ClaimId
      # read from: crates/canon/src/model/predicate.rs:239
      - name: is
        type: canon.protocol.Truth

  # The evaluation documents (story:three-valued-claims). `canon evaluate` reads a canon-case/1
  # case snapshot and canon-evidence/1 records against a compiled protocol and writes one
  # canon-decision/1 document; story:decision-outcomes adds the canon-decisions/1 explicit
  # decisions it may also read (ExplicitDecision below). Later stories add optional fields and
  # sections to these shapes and never replace them; what an evaluation means is Canon's
  # conformance suite (conformance/scenarios/three-valued-claims.yaml), not this file.

  # read from: .engineering/planning/story/three-valued-claims.md:57
  - name: canon.protocol.CaseId
    kind: newtype
    of: String

  # A revision of an artifact, or of the case itself (Case.revision, ExplicitDecision.case_revision):
  # opaque text, compared for equality only (design § 9).
  # read from: .engineering/planning/story/three-valued-claims.md:57-60
  - name: canon.protocol.Revision
    kind: newtype
    of: String

  # read from: .engineering/planning/story/three-valued-claims.md:59
  - name: canon.protocol.EvidenceId
    kind: newtype
    of: String

  # An instant written YYYY-MM-DDTHH:MM:SSZ in UTC, or with a fraction of one to nine digits after
  # the seconds, YYYY-MM-DDTHH:MM:SS.fffZ; uppercase T and Z, no leap second (2026-10-04T12:00:00Z,
  # 2026-10-04T12:00:00.400Z). An empty fraction, more than nine digits and a comma are not instants.
  # An instant names the interval its last written digit spans: 12:00:00Z is the second
  # [12:00:00, 12:00:01), 12:00:00.4Z is [12:00:00.4, 12:00:00.5). Order forms compare every
  # instant of one evaluation at one resolution, the coarsest written among the records with an
  # observed_at, each read by dropping the finer digits: instants that differ there are ordered,
  # equal ones are not. Expiry reads the whole seconds and ignores the fraction. Evidence records
  # when it was observed in this form, and the evaluation instant (`--at`) is given in it.
  # read from: docs/design/canon-protocol-calculus-design.md:505
  # read from: .engineering/planning/story/evidence-freshness.md:50-53
  # read from: .engineering/planning/story/evidence-order-subsecond.md:30-69
  # read from: crates/canon/src/model/ids.rs:177-186
  # read from: crates/canon/src/model/time.rs:1-54
  - name: canon.protocol.Instant
    kind: newtype
    of: String

  # A length of time: a whole number without leading zeros, followed by s, m, h or d (5m, 24h).
  # read from: docs/design/canon-protocol-calculus-design.md:477
  # read from: .engineering/planning/story/evidence-freshness.md:50
  - name: canon.protocol.Age
    kind: newtype
    of: String

  # One declared artifact as a case snapshot records it.
  # read from: .engineering/planning/story/three-valued-claims.md:57-58
  - name: canon.protocol.CaseArtifact
    kind: struct
    fields:
      # The artifact's current revision.
      # read from: .engineering/planning/story/three-valued-claims.md:57-58
      - name: revision
        type: canon.protocol.Revision

  # One canon-evidence/1 record. subject and subject_revision bind it to one revision of one
  # declared artifact; story:evidence-revision-binding makes the evaluator apply it only there.
  # read from: .engineering/planning/story/three-valued-claims.md:59-61
  - name: canon.protocol.EvidenceRecord
    kind: struct
    fields:
      # The only accepted value is canon-evidence/1.
      # read from: .engineering/planning/story/three-valued-claims.md:59
      - name: format
        type: String
      # read from: .engineering/planning/story/three-valued-claims.md:59
      - name: id
        type: canon.protocol.EvidenceId
      # read from: .engineering/planning/story/three-valued-claims.md:59
      - name: kind
        type: canon.protocol.EvidenceKindId
      # A record without a result matches an evidence match that names no result, and no match
      # that names one (.engineering/planning/story/three-valued-claims.md:46-50).
      # read from: .engineering/planning/story/three-valued-claims.md:59
      - name: result
        type: Optional<String>
      # read from: .engineering/planning/story/three-valued-claims.md:59
      - name: subject
        type: canon.protocol.ArtifactId
      # read from: .engineering/planning/story/three-valued-claims.md:60
      - name: subject_revision
        type: canon.protocol.Revision
      # When the observation was made; its age at the evaluation instant is measured from here.
      # A record without it is never expired, so no earlier expectation changes.
      # read from: .engineering/planning/story/evidence-freshness.md:52-53
      # read from: .engineering/planning/story/evidence-freshness.md:77-78
      - name: observed_at
        type: Optional<canon.protocol.Instant>
      # The revision of each upstream artifact the observation was made against, keyed by
      # artifact id (story:invalidation-rules). Optional: a record that leaves it out records no
      # upstream revision and is never invalidated, so no earlier expectation changes. Each key is
      # an artifact the protocol declares and each revision an identifier; the evaluator refuses
      # an undeclared one as undeclared-artifact, naming the record and the artifact, as it
      # refuses an undeclared subject.
      # read from: .engineering/planning/story/invalidation-rules.md:43-45
      # read from: .engineering/planning/story/invalidation-rules.md:50-51
      # read from: .engineering/planning/story/invalidation-rules.md:69-70
      - name: upstream_revisions
        type: Map<canon.protocol.ArtifactId, canon.protocol.Revision>
      # Who produced the record (story:evidence-independence): an opaque principal id, recorded as
      # given. Canon does not prove it; signing and attestation are out. Optional: a record without
      # one is of no evidence match that demands independence, and of every other match as before,
      # so no earlier expectation changes. The evaluator refuses one that is not an identifier
      # (invalid-identifier), naming the record.
      # read from: .engineering/planning/story/evidence-independence.md:68-69
      # read from: .engineering/planning/story/evidence-independence.md:74-75
      - name: producer
        type: Optional<canon.protocol.Principal>

  # One explicit decision of a canon-decisions/1 document. `canon evaluate --decisions` names that
  # document: a YAML (or JSON) list of these entries, the way canon-authority/1 is a list of
  # authority decisions; an empty list decides nothing. A decision applies to the outcome it names
  # when the outcome requires a decision of its name and its case_revision is the case snapshot's
  # revision; a decision taken at a superseded case revision does not apply, and the outcome stays
  # blocked (CANON-OUTCOME-002).
  # read from: .engineering/planning/story/decision-outcomes.md:46-48
  # read from: .engineering/planning/story/decision-outcomes.md:53-54
  - name: canon.protocol.ExplicitDecision
    kind: struct
    fields:
      # Which decision was taken; an outcome's `requires: decision:` names it.
      # read from: docs/design/canon-protocol-calculus-design.md:662
      - name: decision
        type: canon.protocol.DecisionName
      # The outcome the decision is taken for, which the protocol declares.
      # read from: .engineering/planning/story/decision-outcomes.md:47
      - name: outcome
        type: canon.protocol.OutcomeId
      # Who took it.
      # read from: .engineering/planning/story/decision-outcomes.md:47
      - name: principal
        type: canon.protocol.Principal
      # The case revision the decision was taken at, compared for equality with the case
      # snapshot's revision.
      # read from: .engineering/planning/story/decision-outcomes.md:47-48
      # read from: .engineering/planning/story/decision-outcomes.md:106-108
      - name: case_revision
        type: canon.protocol.Revision

  # One authority decision of a canon-authority/1 document. `canon evaluate --authority` names that
  # document: a YAML (or JSON) list of these entries; an empty list decides nothing, and an empty
  # document is not a list. Canon grants nothing and resolves no identity: whoever runs the
  # evaluation decides which capabilities are granted and passes those decisions in (design § 33).
  # A capability no action requires may be decided; it changes no action. Refused, in this order:
  # text that is not such a list, or an entry with another key, another decision or a missing key,
  # as malformed-input, naming the key an entry leaves out; then, entry by entry in the order given,
  # a capability that is not an identifier as invalid-identifier, and a capability decided a second
  # time as duplicate-identifier.
  # read from: crates/canon/src/eval/authority.rs:1-20
  # read from: crates/canon/src/model/authority.rs:18-27
  # read from: .engineering/planning/story/review-hardening-w7.md:28
  # read from: .engineering/planning/story/review-hardening-w7.md:31
  - name: canon.protocol.AuthorityDecision
    kind: struct
    fields:
      # The capability decided, an identifier an action's `requires` may name.
      # read from: crates/canon/src/model/authority.rs:24
      - name: capability
        type: canon.protocol.CapabilityId
      # Whether it is granted.
      # read from: crates/canon/src/model/authority.rs:26
      - name: decision
        type: canon.protocol.Grant

  # An authority decision on one capability. An action whose precondition is true is admissible
  # when every capability it requires is granted, blocked when one is denied, naming it, and
  # approval-required when none is denied and one is not decided (CANON-AUTHORITY-001).
  # read from: crates/canon/src/model/authority.rs:29-39
  # read from: crates/canon/src/eval/actions.rs:23-29
  - name: canon.protocol.Grant
    kind: enum
    variants: ["granted", "denied"]

  # One claim's entry in a decision. An object rather than a bare value, so that later stories add
  # to it (story:evidence-revision-binding adds the excluded evidence).
  # read from: .engineering/planning/story/three-valued-claims.md:62-63
  - name: canon.protocol.ClaimDecision
    kind: struct
    fields:
      # read from: .engineering/planning/story/three-valued-claims.md:41-43
      - name: value
        type: canon.protocol.Truth
      # The evidence an exclusion stage kept from this claim, each with its reason. Empty unless a
      # stage excluded something, and not serialized when empty, so earlier expectations hold.
      # read from: .engineering/planning/story/evaluator-skeleton.md:74-77
      - name: excluded_evidence
        type: List<canon.protocol.EvidenceExclusion>

  # One evidence record an exclusion stage kept from a claim, and why.
  # read from: .engineering/planning/story/evaluator-skeleton.md:74-76
  - name: canon.protocol.EvidenceExclusion
    kind: struct
    fields:
      # read from: .engineering/planning/story/evaluator-skeleton.md:75
      - name: evidence
        type: canon.protocol.EvidenceId
      # read from: .engineering/planning/story/evaluator-skeleton.md:75-76
      - name: reason
        type: canon.protocol.ExclusionReason

  # Why evidence was excluded: bound to another revision of its subject
  # (story:evidence-revision-binding), older than its kind allows (story:evidence-freshness),
  # invalidated by a rule (story:invalidation-rules), or produced by a producer the case does not
  # list as independent on every dimension an evidence match demands (story:evidence-independence).
  # A record is not_independent under a claim when an evidence match the claim reaches would read it
  # by kind and subject, no earlier reason keeps it from the claim, and no match the claim reaches
  # that reads it accepts its producer.
  # read from: .engineering/planning/story/evaluator-skeleton.md:75-76
  # read from: .engineering/planning/story/evidence-independence.md:74-78
  - name: canon.protocol.ExclusionReason
    kind: enum
    variants: ["revision_mismatch", "expired", "invalidated", "not_independent"]

  # The status of one obligation in canon-decision/1's obligations section: not_applicable when its
  # applicable_when predicate is false (story:case-inputs), so it holds back nothing; otherwise
  # discharged when its discharged_when predicate is true, whatever its applicability; open
  # otherwise, including when its applicability is unknown, because unknown is not false.
  # read from: .engineering/planning/story/obligations.md:30-37
  # read from: .engineering/planning/story/case-inputs.md:82-90
  - name: canon.protocol.ObligationStatus
    kind: enum
    variants: ["open", "discharged", "not_applicable"]

  # The canon-decision/1 document: which protocol revision applied to which case, and each declared
  # claim's value. Serialized as canonical JSON, the serialization canon-ir/1 uses.
  # read from: .engineering/planning/story/three-valued-claims.md:62-63
  - name: canon.protocol.Decision
    kind: struct
    fields:
      # The only accepted value is canon-decision/1 (docs/design/canon-protocol-calculus-design.md:714).
      # read from: .engineering/planning/story/three-valued-claims.md:62
      - name: format
        type: String
      # read from: .engineering/planning/story/three-valued-claims.md:62
      - name: case
        type: canon.protocol.CaseId
      # read from: .engineering/planning/story/three-valued-claims.md:62
      - name: protocol
        type: canon.protocol.ProtocolId
      # Copied from the compiled protocol's revision, so never negative (Protocol: revision >= 0).
      # The bound is not restated here: ess 0.52.0 refuses an invariant on a type that no view
      # publishes (ESS-SYNTH-013), and this specification has no views.
      # read from: .engineering/planning/story/three-valued-claims.md:62
      - name: protocol_revision
        type: Integer
      # Every claim the protocol declares, keyed by its id.
      # read from: .engineering/planning/story/three-valued-claims.md:62-63
      - name: claims
        type: Map<canon.protocol.ClaimId, canon.protocol.ClaimDecision>
      # The four section slots stay untyped Json. Each section's shape is fixed by its story's
      # conformance scenarios, not here; typing these slots in ESS is a later model story, not
      # story:obligations, story:action-admissibility or story:outcomes. A slot is absent until its
      # story fills it, and not serialized when absent.
      # read from: .engineering/planning/story/evaluator-skeleton.md:72-75
      # Filled by story:obligations; its shape is fixed by that story's conformance scenarios. Each
      # entry's status is an ObligationStatus; story:case-inputs adds not_applicable, and an entry
      # whose applicability is unknown carries reasons naming what is unknown (CANON-INPUT-001).
      - name: obligations
        type: Optional<Json>
      # Filled by story:action-admissibility; its shape is fixed by that story's conformance
      # scenarios.
      - name: actions
        type: Optional<Json>
      # Filled by story:outcomes; its shape is fixed by that story's conformance scenarios
      # (CANON-OUTCOME-001) and, for an outcome that requires an explicit decision, by
      # CANON-OUTCOME-002 (story:decision-outcomes): a legitimate one records decided_by
      # ({"decision": <name>, "principals": [...]}), and a blocked one gives the reason
      # {"decision": <name>, "present": false}.
      - name: outcomes
        type: Optional<Json>
      # Filled by story:explanation; its shape is fixed by that story's conformance scenarios.
      - name: explanation
        type: Optional<Json>

entities:
  # The source model's root, with its header (id, revision, description) written in place. Every
  # declaration section is a map keyed by identifier (crates/canon/src/model/mod.rs:132-136); the
  # declarations are values with no identity outside their protocol, so they are types, not
  # entities, and need no relations. The case a protocol governs is the Case entity below.
  # read from: crates/canon/src/model/mod.rs:27-57
  - name: canon.protocol.Protocol
    identity:
      # read from: crates/canon/src/model/mod.rs:53
      name: protocol_id
      type: canon.protocol.ProtocolId
    fields:
      # The only accepted value is protocol/1 (crates/canon/src/model/parse.rs:8).
      # read from: crates/canon/src/model/mod.rs:33
      - name: format
        type: String
      # read from: crates/canon/src/model/mod.rs:54
      - name: revision
        type: Integer
      # read from: crates/canon/src/model/mod.rs:56
      - name: description
        type: Optional<String>
      # read from: crates/canon/src/model/mod.rs:36
      - name: artifacts
        type: Map<canon.protocol.ArtifactId, canon.protocol.Artifact>
      # read from: crates/canon/src/model/mod.rs:38
      - name: evidence_kinds
        type: Map<canon.protocol.EvidenceKindId, canon.protocol.EvidenceKind>
      # read from: crates/canon/src/model/mod.rs:40
      - name: claims
        type: Map<canon.protocol.ClaimId, canon.protocol.Claim>
      # read from: crates/canon/src/model/mod.rs:42
      - name: obligations
        type: Map<canon.protocol.ObligationId, canon.protocol.Obligation>
      # read from: crates/canon/src/model/mod.rs:44
      - name: actions
        type: Map<canon.protocol.ActionId, canon.protocol.Action>
      # read from: crates/canon/src/model/mod.rs:46
      - name: outcomes
        type: Map<canon.protocol.OutcomeId, canon.protocol.Outcome>
      # The invalidation rules, keyed by rule id (story:invalidation-rules). Source text writes the
      # section `invalidation:`; a protocol without one declares no rule, and its canon-ir/1 has no
      # `invalidation` key, so the IR of every earlier protocol is unchanged.
      # read from: .engineering/planning/story/invalidation-rules.md:41-46
      # read from: .engineering/planning/story/invalidation-rules.md:50-52
      # read from: docs/design/canon-protocol-calculus-design.md:239
      - name: invalidation
        type: Map<canon.protocol.InvalidationRuleId, canon.protocol.InvalidationRule>
      # The case inputs a case governed by the protocol gives (story:case-inputs), under `case:`,
      # where the design's sketch puts them. Optional: a protocol without it declares no input.
      # read from: .engineering/planning/story/case-inputs.md:66-70
      # read from: docs/design/canon-protocol-calculus-design.md:631-634
      - name: case
        type: Optional<canon.protocol.CaseSection>
      # The independence dimensions the protocol's evidence matches may demand, keyed by dimension
      # id (story:evidence-independence), as the case section declares case inputs. A protocol
      # without the section declares none, and its canon-ir/1 has no `independence_dimensions` key,
      # so the IR of every earlier protocol is unchanged.
      # read from: .engineering/planning/story/evidence-independence.md:63-65
      - name: independence_dimensions
        type: Map<canon.protocol.IndependenceDimensionId, canon.protocol.IndependenceDimension>
    # revision is a u64 (crates/canon/src/model/mod.rs:54); ESS Integer is signed.
    invariants:
      - revision >= 0
    # The model has no lifecycle: a protocol is declared and stays declared. No commands.
    lifecycle:
      initial: Declared
      states: [Declared]
      terminal: [Declared]

  # A canon-case/1 case snapshot: one concrete undertaking governed by one protocol, with the
  # current revision of each artifact the protocol declares (design § 4.2). A snapshot is read,
  # never changed by Canon; story:outcomes adds how a case terminates.
  # read from: .engineering/planning/story/three-valued-claims.md:57-58
  - name: canon.protocol.Case
    identity:
      # read from: .engineering/planning/story/three-valued-claims.md:57
      name: id
      type: canon.protocol.CaseId
    fields:
      # The only accepted value is canon-case/1.
      # read from: .engineering/planning/story/three-valued-claims.md:57
      - name: format
        type: String
      # The protocol that governs the case.
      # read from: .engineering/planning/story/three-valued-claims.md:57
      - name: protocol
        type: canon.protocol.ProtocolId
      # The current revision of each declared artifact, keyed by artifact id.
      # read from: .engineering/planning/story/three-valued-claims.md:57-58
      - name: artifacts
        type: Map<canon.protocol.ArtifactId, canon.protocol.CaseArtifact>
      # The outcome the case terminated through; absent while the case is open. A case terminates
      # only through an outcome its protocol declares (design § 32 CANON-OUTCOME-001,
      # docs/design/canon-protocol-calculus-design.md:1448); story:outcomes checks it.
      # read from: .engineering/planning/story/evaluator-skeleton.md:77-78
      # read from: .engineering/planning/story/outcomes.md:38-39
      - name: termination
        type: Optional<canon.protocol.OutcomeId>
      # The case's own current revision, which an explicit decision is bound to: a decision applies
      # only while its case_revision is this one (story:decision-outcomes). A snapshot without one
      # has no current revision, so no explicit decision applies to it and every earlier
      # expectation holds.
      # read from: .engineering/planning/story/decision-outcomes.md:47-48
      # read from: .engineering/planning/story/decision-outcomes.md:53-54
      # read from: docs/design/canon-protocol-calculus-design.md:1604
      - name: revision
        type: Optional<canon.protocol.Revision>
      # The value of each case input, keyed by input id (story:case-inputs): fixed when the case
      # opens. Optional for a protocol that declares no input. An evaluation is refused, naming the
      # input, when the case gives an input the protocol does not declare (undeclared-input), a
      # value the input does not declare (undeclared-input-value, naming the value too), or no value
      # for a declared input (missing-input).
      # read from: .engineering/planning/story/case-inputs.md:71-76
      - name: inputs
        type: Map<canon.protocol.InputId, canon.protocol.InputValue>
      # The dimensions on which each producer is independent of the case's work, keyed by producer
      # (story:evidence-independence). The trusted context that writes the case resolves it; Canon
      # reads it as given. A producer absent from the map, or listed with [], is independent on no
      # dimension. Optional: a case without it lists no producer. An evaluation is refused when a
      # producer or a dimension is not an identifier (invalid-identifier), a producer is listed
      # twice or a dimension twice for one producer (duplicate-identifier), or a dimension is one
      # the protocol does not declare (undeclared-dimension), each naming the producer, and the
      # dimension where there is one.
      # read from: .engineering/planning/story/evidence-independence.md:70-73
      # read from: .engineering/planning/story/evidence-independence.md:79-80
      # read from: docs/design/canon-protocol-calculus-design.md:1665
      - name: independence
        type: Map<canon.protocol.Principal, List<canon.protocol.IndependenceDimensionId>>
    relations:
      # Every case is governed by exactly one protocol (design § 4.2).
      # read from: docs/design/canon-protocol-calculus-design.md:247
      - name: protocol
        kind: references
        target: canon.protocol.Protocol
        cardinality: one
        via: protocol
    # Canon reads a snapshot and never moves it: no lifecycle and no commands here.
    lifecycle:
      initial: Recorded
      states: [Recorded]
      terminal: [Recorded]
